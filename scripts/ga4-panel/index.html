<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de tráfico · hacecuentas</title>
<style>
  .viz-root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --ghost:          rgba(11,11,11,0.04);
    --series-1:       #2a78d6;  /* hoy */
    --series-2:       #1baf7a;  /* ayer */
    --series-3:       #eda100;  /* semana pasada */
    --good:           #006300;
    --critical:       #d03b3b;
    --warning:        #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --ghost:          rgba(255,255,255,0.06);
      --series-1:       #3987e5;
      --series-2:       #199e70;
      --series-3:       #c98500;
      --good:           #0ca30c;
      --critical:       #e66767;
      --warning:        #fab219;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --ghost:          rgba(255,255,255,0.06);
    --series-1:       #3987e5;
    --series-2:       #199e70;
    --series-3:       #c98500;
    --good:           #0ca30c;
    --critical:       #e66767;
    --warning:        #fab219;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px 20px 64px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }

  /* header */
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .top .prop { font-size: 12px; color: var(--muted); }
  .top .spacer { flex: 1; }
  .stamp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px;
  }
  button:hover { background: var(--ghost); }
  button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .btn-primary { background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 500; }
  .btn-primary:hover { filter: brightness(1.08); background: var(--series-1); }
  .btn-primary[aria-busy="true"] { opacity: .6; cursor: progress; }

  /* cards */
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 18px;
  }
  .card > h2 { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
  .card > .sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.5; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  @media (max-width: 680px) { .tiles { grid-template-columns: 1fr; } }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k {
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .tile .v { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .tile.baseline .v { font-size: 24px; color: var(--text-secondary); font-weight: 500; }
  .tile .deltas { display: flex; flex-direction: column; gap: 3px; margin-top: 9px; }
  .delta { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .delta b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .up b { color: var(--good); }
  .down b { color: var(--critical); }
  /* delta que la atribución todavía no respalda: se muestra, no se colorea */
  .delta b.unsure { color: var(--text-secondary); font-weight: 600; cursor: help; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .tile .foot { font-size: 11.5px; color: var(--muted); margin-top: 7px; font-variant-numeric: tabular-nums; }

  /* notice */
  .notice {
    display: flex; gap: 9px; align-items: flex-start;
    border: 1px solid var(--border); border-left: 3px solid var(--warning);
    border-radius: 8px; padding: 10px 13px; margin-bottom: 18px;
    font-size: 12.5px; color: var(--text-secondary); line-height: 1.5;
  }
  .notice svg { flex: none; margin-top: 1px; }
  .notice b { color: var(--text-primary); font-weight: 600; }

  /* chart */
  .chart-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend .line { width: 14px; height: 2px; border-radius: 1px; flex: none; }
  .chart-head .spacer { flex: 1; }
  .chart-wrap { position: relative; }
  svg.plot { display: block; width: 100%; height: auto; touch-action: none; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.14); min-width: 132px; z-index: 5;
  }
  .tip .h { font-weight: 600; margin-bottom: 5px; font-size: 11.5px; }
  .tip .r { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--text-secondary); }
  .tip .r .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 500; }

  /* filters */
  .filters {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin: 26px 0 14px;
  }
  .presets { display: flex; gap: 4px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .presets button { border: none; background: none; padding: 5px 10px; border-radius: 5px; color: var(--text-secondary); }
  .presets button[aria-pressed="true"] { background: var(--series-1); color: #fff; font-weight: 500; }
  .presets button[aria-pressed="true"]:hover { filter: brightness(1.08); }
  .range { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--text-secondary); }
  input[type="date"], select {
    font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  .filters.scope { margin: 0 0 18px; }
  .filters.scope label { font-size: 12.5px; color: var(--text-secondary); }
  .filters.scope select { font-size: 13px; padding: 6px 10px; font-weight: 500; }
  .filters.scope select:not([data-all]) { border-color: var(--series-1); color: var(--series-1); }
  .scope-note { font-size: 12px; color: var(--muted); }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: right; font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); padding: 0 10px 9px;
    border-bottom: 1px solid var(--baseline); white-space: nowrap;
  }
  th:first-child { text-align: left; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; text-align: right; }
  td:first-child { text-align: left; font-variant-numeric: normal; }
  tr.ch { cursor: pointer; }
  tr.ch:hover { background: var(--ghost); }
  tr.ch td { font-weight: 500; }
  tr.ch .name { display: flex; align-items: center; gap: 8px; }
  .caret { color: var(--muted); transition: transform .12s; flex: none; }
  tr.open .caret { transform: rotate(90deg); }
  tr.src td { color: var(--text-secondary); font-weight: 400; border-bottom-color: var(--gridline); }
  tr.src td:first-child { padding-left: 32px; font-size: 12.5px; }
  tr.src { background: var(--ghost); }
  .bar-cell { width: 108px; }
  .bar { height: 6px; border-radius: 4px; background: var(--series-1); min-width: 2px; }
  tr.src .bar { background: var(--series-1); opacity: .45; }
  /* el min-width va en el div: un td cede su width al reparto automático de la tabla */
  .bar-track { background: var(--gridline); border-radius: 4px; height: 6px; min-width: 96px; }
  .share { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 22px 0; text-align: center; }
  .err {
    border: 1px solid var(--critical); border-radius: 8px; padding: 12px 14px;
    font-size: 13px; color: var(--critical); margin-bottom: 18px;
  }
  .loading { opacity: .45; transition: opacity .15s; }
  .tbl-scroll { overflow-x: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">

  <div class="top">
    <h1>Panel de tráfico</h1>
    <span class="prop">hacecuentas · GA4 532962136</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
    <button id="theme" title="Cambiar tema">◐</button>
    <button class="btn-primary" id="refresh">↻ Actualizar</button>
  </div>

  <div class="err" id="err" hidden></div>

  <!-- filtro de canal: scopea TODO el panel, por eso va arriba de todo -->
  <div class="filters scope">
    <label for="channel">Canal</label>
    <select id="channel"><option value="__all__">Todos los canales</option></select>
    <span class="scope-note" id="scope-note" hidden></span>
  </div>

  <!-- ── PULSO DEL DÍA ────────────────────────────────────────────── -->
  <section class="card" id="pulse-card">
    <h2 id="pulse-title">Cómo venimos hoy</h2>
    <p class="sub" id="pulse-sub">Cargando…</p>

    <div class="notice" id="partial-notice" hidden>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="var(--warning)" stroke-width="1.6"/>
        <path d="M8 4.5v4M8 11.2v.6" stroke="var(--warning)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span id="partial-text"></span>
    </div>

    <div class="notice" id="unassigned-notice" hidden>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="var(--warning)" stroke-width="1.6"/>
        <path d="M8 4.5v4M8 11.2v.6" stroke="var(--warning)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span id="unassigned-text"></span>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="chart-head">
      <div class="legend" id="legend"></div>
      <span class="spacer"></span>
      <button id="mode-toggle" title="Alternar acumulado / por hora">Acumulado</button>
      <button id="view-toggle">Ver tabla</button>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg class="plot" id="plot" viewBox="0 0 860 300" role="img"
           aria-label="Sesiones por hora: hoy, ayer y mismo día de la semana pasada"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="tbl-scroll" id="curve-table" hidden></div>
  </section>

  <!-- ── POR CANAL ────────────────────────────────────────────────── -->
  <div class="filters">
    <div class="presets" id="presets">
      <button data-preset="today">Hoy</button>
      <button data-preset="yesterday">Ayer</button>
      <button data-preset="7" aria-pressed="true">7 días</button>
      <button data-preset="28">28 días</button>
      <button data-preset="90">90 días</button>
    </div>
    <div class="range">
      <label for="start">Desde</label>
      <input type="date" id="start">
      <label for="end">hasta</label>
      <input type="date" id="end">
    </div>
  </div>

  <section class="card">
    <h2 id="report-title">Sesiones por canal</h2>
    <p class="sub" id="report-sub">Cargando…</p>
    <div class="tbl-scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th id="th-first">Canal · fuente / medio</th>
            <th class="bar-cell"></th>
            <th>Sesiones</th>
            <th>Share</th>
            <th>Δ vs previo</th>
            <th>Usuarios</th>
            <th>Engagement</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="report-empty" hidden>Sin sesiones en este rango.</div>
  </section>

</div>
</div>

<script>
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('es-AR');
const fmt = n => nf.format(n || 0);
const SERIES = [
  { key: 'today',     label: 'Hoy',                  color: 'var(--series-1)' },
  { key: 'yesterday', label: 'Ayer',                 color: 'var(--series-2)' },
  { key: 'lastWeek',  label: 'Mismo día sem. pas.',  color: 'var(--series-3)' },
];

const ALL = '__all__';
let pulse = null, report = null, cumMode = true, tableView = false, channel = ALL;
const openChannels = new Set();

/* Con "Unassigned" inflado, un canal suelto de hoy está SUBESTIMADO: esas
   sesiones todavía no se repartieron. Ayer a esta hora quedaba ~1% sin asignar,
   hoy puede ser 50% — el delta del canal mide el lag de atribución, no tráfico.
   Umbral: 3× el residuo ya asentado de ayer, y al menos 5 puntos. */
const attributionSkewed = () => {
  if (!pulse || channel === ALL || channel === 'Unassigned') return false;
  const t = pulse.unassigned.today.share, y = pulse.unassigned.yesterday.share;
  return t > 0.05 && t > Math.max(y * 3, 0.05);
};

/* ── tema ─────────────────────────────────────────────────────────── */
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  if (pulse) drawChart();
};

/* ── fechas ───────────────────────────────────────────────────────── */
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
// "hoy" en horario local, sin corrimiento por UTC
const localToday = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d; };
const DAY_FMT = new Intl.DateTimeFormat('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
const prettyDay = s => DAY_FMT.format(new Date(s + 'T12:00:00'));

function applyPreset(p) {
  const today = localToday();
  let s, e;
  if (p === 'today')          { s = e = today; }
  else if (p === 'yesterday') { s = e = addDays(today, -1); }
  else { e = addDays(today, -1); s = addDays(e, -(parseInt(p, 10) - 1)); }  // rangos cerrados: terminan ayer
  $('start').value = iso(s); $('end').value = iso(e);
  for (const b of $('presets').children) b.setAttribute('aria-pressed', String(b.dataset.preset === p));
}
for (const b of $('presets').children) {
  b.onclick = () => { applyPreset(b.dataset.preset); loadReport(); };
}
$('start').onchange = $('end').onchange = () => {
  for (const b of $('presets').children) b.setAttribute('aria-pressed', 'false');
  loadReport();
};

/* ── fetch ────────────────────────────────────────────────────────── */
function showErr(msg) { $('err').textContent = msg; $('err').hidden = !msg; }

async function loadPulse(fresh) {
  $('pulse-card').classList.add('loading');
  try {
    const r = await fetch('/api/pulse' + (fresh ? '?fresh=1' : ''));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    pulse = d; syncChannelOptions(); applyScope(); renderPulse(); tickStamp();
  } catch (e) { showErr('No se pudo leer el pulso del día: ' + e.message); }
  finally { $('pulse-card').classList.remove('loading'); }
}

async function loadReport(fresh) {
  const start = $('start').value, end = $('end').value;
  if (!start || !end) return;
  const tbl = $('tbl'); tbl.classList.add('loading');
  try {
    const r = await fetch(`/api/report?start=${start}&end=${end}${fresh ? '&fresh=1' : ''}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    report = d; syncChannelOptions(); renderReport();
  } catch (e) { showErr('No se pudo leer el reporte por canal: ' + e.message); }
  finally { tbl.classList.remove('loading'); }
}

$('refresh').onclick = async () => {
  const b = $('refresh');
  b.setAttribute('aria-busy', 'true'); b.disabled = true;
  showErr('');
  await Promise.all([loadPulse(true), loadReport(true)]);
  b.removeAttribute('aria-busy'); b.disabled = false;
};

/* ── pulso ────────────────────────────────────────────────────────── */
function deltaHtml(cur, base, label, skewed) {
  if (!base) return `<div class="delta">— vs ${label} (sin datos)</div>`;
  const pct = (cur - base) / base * 100;
  const up = pct >= 0;
  const sign = `${up ? '↑' : '↓'} ${up ? '+' : '−'}${Math.abs(pct).toFixed(0)}%`;
  // sin atribución cerrada no hay conclusión: se muestra el número, no el color
  if (skewed) return `<div class="delta"><b class="unsure" title="La atribución de hoy todavía no cerró">⚠ ${sign}</b> vs ${label} · ${fmt(base)}</div>`;
  return `<div class="delta ${up ? 'up' : 'down'}"><b>${sign}</b> vs ${label} · ${fmt(base)}</div>`;
}

const curOf = key => pulse.series[channel]?.[key] || new Array(24).fill(0);
const credOf = key => pulse.credited[channel]?.[key] ?? 0;
const upto = (arr, n) => arr.slice(0, n + 1).reduce((a, b) => a + b, 0);

function renderPulse() {
  const p = pulse;
  const hh = String(p.cutoff).padStart(2, '0');
  const label = channel === ALL ? '' : ` · ${channel}`;
  // el valor es el ACREDITADO (query sin `hour`: el que coincide con GA4).
  // el corte por hora sólo se usa para el %, si no compararíamos un día parcial
  // contra días enteros.
  const cut = {
    today: upto(curOf('today'), p.cutoff),
    yesterday: upto(curOf('yesterday'), p.cutoff),
    lastWeek: upto(curOf('lastWeek'), p.cutoff),
  };
  const skew = attributionSkewed();

  $('pulse-title').textContent = 'Cómo venimos hoy' + label;
  $('pulse-sub').innerHTML =
    `El número es de <b>sesiones acreditadas</b> — el mismo que da GA4. Los % comparan hasta
     las <b>${hh}:59</b>, el mismo corte en los tres días, porque hoy es un día a medio andar.
     Cortar por hora cuenta dos veces las sesiones a caballo de dos horas, así que el acumulado
     corre ~3% arriba del acreditado.`;

  $('tiles').innerHTML = `
    <div class="tile">
      <div class="k"><span class="swatch" style="background:var(--series-1)"></span>Hoy · ${prettyDay(p.dates.today)}</div>
      <div class="v">${fmt(credOf('today'))}</div>
      <div class="deltas">
        ${deltaHtml(cut.today, cut.yesterday, 'ayer a esta hora', skew)}
        ${deltaHtml(cut.today, cut.lastWeek, prettyDay(p.dates.lastWeek) + ' a esta hora', skew)}
      </div>
      <div class="foot">a esta hora vamos: ${fmt(cut.today)} — de ahí salen los %</div>
    </div>
    <div class="tile baseline">
      <div class="k"><span class="swatch" style="background:var(--series-2)"></span>Ayer · ${prettyDay(p.dates.yesterday)}</div>
      <div class="v">${fmt(credOf('yesterday'))}</div>
      <div class="foot">a esta hora iba: ${fmt(cut.yesterday)}</div>
    </div>
    <div class="tile baseline">
      <div class="k"><span class="swatch" style="background:var(--series-3)"></span>${prettyDay(p.dates.lastWeek)}</div>
      <div class="v">${fmt(credOf('lastWeek'))}</div>
      <div class="foot">a esta hora iba: ${fmt(cut.lastWeek)}</div>
    </div>`;

  // hora en curso: incompleta, se informa pero no entra en la comparación
  const ph = {
    today: curOf('today')[p.lastHour], yesterday: curOf('yesterday')[p.lastHour],
  };
  $('partial-text').innerHTML =
    `La hora <b>${String(p.lastHour).padStart(2, '0')}</b> está en curso (${fmt(ph.today)} sesiones hasta ahora) y
     <b>queda fuera de los números de arriba</b>: compararla contra una hora completa de ayer
     (${fmt(ph.yesterday)}) inventaría una caída que no existe.` +
    (p.realtimeUsers != null && channel === ALL
      ? ` En tiempo real hay <b>${fmt(p.realtimeUsers)}</b> usuarios activos.` : '');
  $('partial-notice').hidden = false;

  renderUnassignedNotice(skew);

  $('legend').innerHTML = SERIES.map(s =>
    `<span class="item"><span class="line" style="background:${s.color}"></span>${s.label} · ${prettyDay(p.dates[s.key])}</span>`
  ).join('');

  drawChart();
  renderCurveTable();
}

function renderUnassignedNotice(skew) {
  const p = pulse, un = p.unassigned;
  if (un.today.share <= 0.03) { $('unassigned-notice').hidden = true; return; }
  const pct = n => (n * 100).toFixed(0) + '%';
  $('unassigned-text').innerHTML = skew
    // filtrando un canal, el lag de atribución se lee como caída de ESE canal
    ? `<b>El ${channel} de hoy está subestimado, no caído.</b> ${fmt(un.today.sessions)} sesiones
       (${pct(un.today.share)} del día) siguen en "Unassigned" y todavía no se repartieron a su canal;
       ayer a esta misma hora quedaban ${fmt(un.yesterday.sessions)} (${pct(un.yesterday.share)}).
       GA4 las reasigna en 24–48 h. Por eso el Δ de hoy va sin color: mide la atribución, no el tráfico.
       <b>Para leer ${channel} de verdad, comparar ayer contra el mismo día de la semana pasada</b> — los dos ya cerrados.`
    : `<b>${pct(un.today.share)} de las sesiones de hoy están en "Unassigned"</b> — es el lag de atribución
       de GA4, se reasigna a los canales reales en 24–48 h. Hoy siempre se ve peor por canal que un día ya asentado.`;
  $('unassigned-notice').hidden = false;
}

/* ── filtro de canal ──────────────────────────────────────────────── */
function syncChannelOptions() {
  const sel = $('channel');
  const names = new Set(pulse?.channels || []);
  for (const c of report?.channels || []) names.add(c.channel);
  const opts = [ALL, ...[...names].filter(n => n !== ALL)];
  if (sel.dataset.opts === opts.join('|')) return;
  sel.dataset.opts = opts.join('|');
  sel.innerHTML = opts.map(o =>
    `<option value="${escapeAttr(o)}">${o === ALL ? 'Todos los canales' : escapeHtml(o)}</option>`).join('');
  sel.value = names.has(channel) || channel === ALL ? channel : ALL;
}

$('channel').onchange = e => {
  channel = e.target.value;
  applyScope();
  if (pulse) renderPulse();
  if (report) renderReport();
};

function applyScope() {
  const sel = $('channel');
  if (channel === ALL) sel.setAttribute('data-all', ''); else sel.removeAttribute('data-all');
  $('scope-note').hidden = channel === ALL;
  $('scope-note').textContent = 'todo el panel filtrado por este canal';
}

/* ── curva por hora ───────────────────────────────────────────────── */
const W = 860, H = 300, PAD = { t: 14, r: 74, b: 34, l: 46 };
const PW = W - PAD.l - PAD.r, PH = H - PAD.t - PAD.b;

function seriesData(key) {
  const raw = curOf(key);
  if (!cumMode) return raw;
  let acc = 0;
  return raw.map(v => (acc += v));
}

function drawChart() {
  const p = pulse;
  const last = p.lastHour;
  const data = {};
  for (const s of SERIES) data[s.key] = seriesData(s.key);

  // hoy sólo tiene datos hasta `last`; el resto del día no existe todavía
  const todayLen = last + 1;
  let max = 0;
  for (const s of SERIES) {
    const arr = data[s.key];
    const upto = s.key === 'today' ? todayLen : 24;
    for (let i = 0; i < upto; i++) max = Math.max(max, arr[i]);
  }
  max = max || 1;
  const ticks = niceTicks(max, 4);
  const top = ticks[ticks.length - 1];

  const x = h => PAD.l + (h / 23) * PW;
  const y = v => PAD.t + PH - (v / top) * PH;

  let svg = '';

  // grid + eje y
  for (const tk of ticks) {
    svg += `<line x1="${PAD.l}" x2="${PAD.l + PW}" y1="${y(tk)}" y2="${y(tk)}"
            stroke="var(--gridline)" stroke-width="1"/>`;
    svg += `<text x="${PAD.l - 9}" y="${y(tk) + 4}" text-anchor="end" font-size="11"
            fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(tk)}</text>`;
  }
  // baseline
  svg += `<line x1="${PAD.l}" x2="${PAD.l + PW}" y1="${y(0)}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>`;
  // eje x
  for (let h = 0; h <= 23; h += 3) {
    svg += `<text x="${x(h)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)"
            style="font-variant-numeric:tabular-nums">${String(h).padStart(2, '0')}</text>`;
  }
  // marca de la hora de corte
  svg += `<line x1="${x(p.cutoff)}" x2="${x(p.cutoff)}" y1="${PAD.t}" y2="${PAD.t + PH}"
          stroke="var(--baseline)" stroke-width="1"/>`;
  svg += `<text x="${x(p.cutoff) + 5}" y="${PAD.t + 10}" font-size="10" fill="var(--muted)">corte ${String(p.cutoff).padStart(2, '0')}:59</text>`;

  const path = (arr, n, from = 0) => arr.slice(from, n).map((v, i) =>
    `${i === 0 ? 'M' : 'L'}${x(i + from).toFixed(1)},${y(v).toFixed(1)}`).join(' ');

  for (const s of SERIES) {
    const arr = data[s.key];
    if (s.key === 'today') {
      // hasta el corte: sólido. la hora en curso: punteada, porque está a medio llenar
      svg += `<path d="${path(arr, p.cutoff + 1)}" fill="none" stroke="${s.color}"
              stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (last > p.cutoff) {
        svg += `<path d="${path(arr, last + 1, p.cutoff)}" fill="none" stroke="${s.color}"
                stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>`;
      }
      svg += `<circle cx="${x(last)}" cy="${y(arr[last])}" r="4" fill="${s.color}"
              stroke="var(--surface-1)" stroke-width="2"/>`;
    } else {
      svg += `<path d="${path(arr, 24)}" fill="none" stroke="${s.color}"
              stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }

  // etiquetas directas al final de cada serie (relief rule: identidad nunca sólo por color)
  const ends = SERIES.map(s => {
    const arr = data[s.key];
    const h = s.key === 'today' ? last : 23;
    return { s, h, v: arr[h], yy: y(arr[h]) };
  }).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) {                 // evita que se pisen
    if (ends[i].yy - ends[i - 1].yy < 13) ends[i].yy = ends[i - 1].yy + 13;
  }
  for (const e of ends) {
    svg += `<text x="${x(e.h) + 8}" y="${e.yy + 4}" font-size="11.5" font-weight="600" fill="${e.s.color}"
            style="font-variant-numeric:tabular-nums">${fmt(e.v)}</text>`;
  }

  // capa de hover: una banda por hora, blanco ancho
  svg += `<g id="hit">`;
  for (let h = 0; h <= 23; h++) {
    svg += `<rect x="${x(h) - PW / 46}" y="${PAD.t}" width="${PW / 23}" height="${PH}"
            fill="transparent" data-h="${h}"/>`;
  }
  svg += `</g>`;
  svg += `<line id="cross" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t + PH}" stroke="var(--baseline)"
          stroke-width="1" opacity="0"/>`;

  $('plot').innerHTML = svg;
  wireHover(data, x, y, last);
}

function niceTicks(max, n) {
  const raw = max / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v));
  return out;
}

function wireHover(data, x, y, last) {
  const plot = $('plot'), tip = $('tip'), cross = plot.querySelector('#cross');
  const wrap = $('chart-wrap');
  const show = h => {
    cross.setAttribute('x1', x(h)); cross.setAttribute('x2', x(h)); cross.setAttribute('opacity', '1');
    const rows = SERIES.map(s => {
      const has = s.key !== 'today' || h <= last;
      return `<div class="r"><span class="swatch" style="background:${s.color}"></span>${s.label}
              <span class="n">${has ? fmt(data[s.key][h]) : '—'}</span></div>`;
    }).join('');
    tip.innerHTML = `<div class="h">${String(h).padStart(2, '0')}:00${cumMode ? ' · acumulado' : ''}</div>${rows}`;
    tip.style.opacity = '1';
    const rect = wrap.getBoundingClientRect();
    const px = (x(h) / W) * rect.width;
    tip.style.left = Math.min(Math.max(px + 12, 0), rect.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '10px';
  };
  plot.querySelectorAll('#hit rect').forEach(r => {
    r.addEventListener('mouseenter', () => show(+r.dataset.h));
  });
  plot.addEventListener('mouseleave', () => { tip.style.opacity = '0'; cross.setAttribute('opacity', '0'); });
}

$('mode-toggle').onclick = () => {
  cumMode = !cumMode;
  $('mode-toggle').textContent = cumMode ? 'Acumulado' : 'Por hora';
  if (pulse) { drawChart(); renderCurveTable(); }
};
$('view-toggle').onclick = () => {
  tableView = !tableView;
  $('view-toggle').textContent = tableView ? 'Ver gráfico' : 'Ver tabla';
  $('chart-wrap').hidden = tableView;
  $('curve-table').hidden = !tableView;
};

function renderCurveTable() {
  const p = pulse, data = {};
  for (const s of SERIES) data[s.key] = seriesData(s.key);
  let html = `<table><thead><tr><th>Hora</th>` +
    SERIES.map(s => `<th>${s.label}</th>`).join('') + `</tr></thead><tbody>`;
  for (let h = 0; h <= 23; h++) {
    html += `<tr><td>${String(h).padStart(2, '0')}:00</td>` + SERIES.map(s => {
      const has = s.key !== 'today' || h <= p.lastHour;
      return `<td>${has ? fmt(data[s.key][h]) : '—'}</td>`;
    }).join('') + `</tr>`;
  }
  $('curve-table').innerHTML = html + `</tbody></table>`;
}

/* ── tabla por canal ──────────────────────────────────────────────── */
function pctCell(cur, prev) {
  if (!prev) return `<td class="share">—</td>`;
  const p = (cur - prev) / prev * 100;
  const up = p >= 0;
  return `<td class="${up ? 'up' : 'down'}"><b style="color:var(--${up ? 'good' : 'critical'})">
    ${up ? '↑' : '↓'} ${up ? '+' : '−'}${Math.abs(p).toFixed(0)}%</b></td>`;
}

function renderReport() {
  const r = report;
  const shown = channel === ALL ? r.channels : r.channels.filter(c => c.channel === channel);
  // el total es el ACREDITADO (query sin dimensiones), nunca la suma de la tabla:
  // con el día abierto una sesión cae en más de un canal y la suma se infla.
  const total = channel === ALL ? r.totals.sessions : shown.reduce((a, c) => a + c.sessions, 0);
  const prevTotal = channel === ALL ? r.totals.prev : shown.reduce((a, c) => a + c.prev, 0);
  // ...pero el share sí va sobre la suma de las filas, si no, no daría 100%
  const shareBase = shown.reduce((a, c) => a + c.sessions, 0);
  const same = r.range.start === r.range.end;
  const inflated = channel === ALL && total && (r.channelSum.sessions - total) / total > 0.02;

  // el previo va desplazado un múltiplo de 7: mismos días de la semana
  const cmp = same
    ? `el mismo día de la semana pasada · ${prettyDay(r.prevRange.start)}`
    : `${prettyDay(r.prevRange.start)} → ${prettyDay(r.prevRange.end)}`;

  $('report-title').textContent = channel === ALL ? 'Sesiones por canal' : `Sesiones · ${channel}`;
  $('report-sub').innerHTML =
    (same ? `<b>${prettyDay(r.range.start)}</b>` : `<b>${prettyDay(r.range.start)} → ${prettyDay(r.range.end)}</b>`) +
    ` · ${fmt(total)} sesiones acreditadas` + (channel === ALL ? '' : ` de ${channel}`) +
    ` · comparado contra ${cmp} (${fmt(prevTotal)}). ` +
    (channel === ALL ? 'Tocá un canal para abrirlo por fuente / medio.'
                     : 'Share y Δ son sobre este canal. Poné "Todos los canales" para volver al total.') +
    (inflated ? ` <b>Las filas suman ${fmt(r.channelSum.sessions)}, más que las ${fmt(total)} acreditadas</b>:
       con el día todavía abierto GA4 cuenta una misma sesión en más de un canal. Cierra solo en 24–48 h.` : '') +
    (r.includesToday ? ` <b>El rango incluye hoy</b>, que es un día parcial: el Δ va a dar negativo por eso.` : '');

  $('report-empty').hidden = shown.length > 0;
  $('report-empty').textContent = channel === ALL
    ? 'Sin sesiones en este rango.' : `Sin sesiones de ${channel} en este rango.`;
  const max = shown[0]?.sessions || 1;

  let html = '';
  for (const c of shown) {
    const open = openChannels.has(c.channel) || channel !== ALL;   // filtrado, ya viene abierto
    const eng = c.sessions ? (c.engaged / c.sessions * 100).toFixed(0) + '%' : '—';
    html += `<tr class="ch ${open ? 'open' : ''}" data-ch="${escapeAttr(c.channel)}" tabindex="0" role="button"
              aria-expanded="${open}">
      <td><span class="name">
        <svg class="caret" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>${escapeHtml(c.channel)}</span></td>
      <td class="bar-cell"><div class="bar-track"><div class="bar" style="width:${(c.sessions / max * 100).toFixed(1)}%"></div></div></td>
      <td>${fmt(c.sessions)}</td>
      <td class="share">${shareBase ? (c.sessions / shareBase * 100).toFixed(1) + '%' : '—'}</td>
      ${pctCell(c.sessions, c.prev)}
      <td>${fmt(c.users)}</td>
      <td>${eng}</td>
    </tr>`;
    if (open) {
      for (const s of c.sources) {
        const se = s.sessions ? (s.engaged / s.sessions * 100).toFixed(0) + '%' : '—';
        html += `<tr class="src">
          <td>${escapeHtml(s.sourceMedium)}</td>
          <td class="bar-cell"><div class="bar-track"><div class="bar" style="width:${(s.sessions / max * 100).toFixed(1)}%"></div></div></td>
          <td>${fmt(s.sessions)}</td>
          <td class="share">${shareBase ? (s.sessions / shareBase * 100).toFixed(1) + '%' : '—'}</td>
          ${pctCell(s.sessions, s.prev)}
          <td>${fmt(s.users)}</td>
          <td>${se}</td>
        </tr>`;
      }
    }
  }
  $('tbody').innerHTML = html;

  $('tbody').querySelectorAll('tr.ch').forEach(tr => {
    const toggle = () => {
      const ch = tr.dataset.ch;
      openChannels.has(ch) ? openChannels.delete(ch) : openChannels.add(ch);
      renderReport();
    };
    tr.onclick = toggle;
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  });
}

const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escapeAttr = escapeHtml;

/* ── stamp ────────────────────────────────────────────────────────── */
function tickStamp() {
  const t = pulse?.fetchedAt;
  if (!t) return;
  const secs = Math.max(0, Math.round(Date.now() / 1000 - t));
  $('stamp').textContent = secs < 60 ? `actualizado hace ${secs}s`
    : `actualizado hace ${Math.round(secs / 60)} min`;
}
setInterval(tickStamp, 5000);

/* ── init ─────────────────────────────────────────────────────────── */
applyPreset('7');
loadPulse();
loadReport();
</script>
</body>
</html>
