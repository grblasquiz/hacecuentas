name: Update data (daily)

# Deterministic public data: validate it before committing, then explicitly
# dispatch production. Bot-created PRs were expiring awaiting approval, and
# their GITHUB_TOKEN merges did not trigger push-based deployments.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Correr en dry mode (no escribe archivos)'
        type: boolean
        default: false

concurrency:
  group: content-writers-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Fetch, validar y publicar datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run daily fetchers
        run: |
          FLAGS="--frequency=daily"
          if [ "${{ inputs.dry }}" = "true" ]; then FLAGS="$FLAGS --dry"; fi
          node --experimental-strip-types scripts/update-data/index.ts $FLAGS

      - name: Validate updated data and formulas
        run: npm test

      - name: Commit validated data
        id: commit
        if: inputs.dry != true
        run: |
          git add db/*.json src/content/calcs*/ src/lib/formulas/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "hacecuentas-data-bot"
          git config user.email "bot@hacecuentas.com"
          git commit -m "chore(data): actualización automática diaria validada"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish through production workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
