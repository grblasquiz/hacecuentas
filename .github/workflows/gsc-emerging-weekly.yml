name: GSC emerging queries (weekly)

# Detecta queries emergentes y audita cobertura real de las URLs prioritarias
# con la API read-only de URL Inspection. Reemplaza al push diario por Indexing
# API, que Google limita oficialmente a JobPosting/BroadcastEvent.

on:
  schedule:
    - cron: '0 12 * * MON'  # lunes 12:00 UTC (09:00 AR) — agenda semanal Martin
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  emerging-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-auth google-api-python-client

      - name: Write GCP credentials
        env:
          GCP_INDEXING_CREDS: ${{ secrets.GCP_INDEXING_CREDS }}
        run: |
          mkdir -p ~/.config/gcp
          echo "$GCP_INDEXING_CREDS" > ~/.config/gcp/hacecuentas-indexing.json

      - name: Run emerging queries report
        run: |
          python3 scripts/gsc-emerging-queries.py --days 28 --top 50 --json /tmp/emerging.json | tee /tmp/emerging.txt

      - name: Audit priority URL coverage (read-only)
        run: |
          python3 scripts/gsc-coverage-audit.py --top 65 --concurrency 4
          cp scripts/gsc-coverage-report.json /tmp/gsc-coverage.json
          python3 - <<'PY' > /tmp/gsc-coverage.txt
          import json
          from collections import Counter

          data = json.load(open('/tmp/gsc-coverage.json'))
          states = Counter(r.get('coverage_state', 'Sin estado') for r in data['not_indexed'])
          total = data['total']
          indexed = data['indexed_count']
          print(f'Indexadas: {indexed}/{total} ({indexed / total * 100:.1f}%)')
          print(f'No indexadas: {data["not_indexed_count"]}/{total}')
          for state, count in states.most_common():
              print(f'- {state}: {count}')
          PY

      - name: Open issue with report
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="📈 GSC queries emergentes — semana $(date -u +'%Y-W%V')"
          BODY=$(cat <<EOF
          Reporte semanal de queries con tracción creciente y cobertura real de las URLs prioritarias.

          **Cobertura URL Inspection (top 65):**
          \`\`\`
          $(cat /tmp/gsc-coverage.txt)
          \`\`\`

          **Queries emergentes (posición 11-50):**
          \`\`\`
          $(cat /tmp/emerging.txt)
          \`\`\`

          **Próximos pasos sugeridos:**
          - Para queries con \`(match: ...)\`: expandir el calc existente (más contenido, casos resueltos, FAQ).
          - Para queries sin match: evaluar crear calc nuevo con \`scripts/new-calc.ts\`.
          - JSON detallado adjunto en el run artifact.

          🤖 Auto-generado por gsc-emerging-weekly
          EOF
          )
          gh issue create --title "$TITLE" --body "$BODY" --label gsc-emerging || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsc-growth-and-coverage
          path: |
            /tmp/emerging.json
            /tmp/gsc-coverage.json
            /tmp/gsc-coverage.txt
          retention-days: 30
