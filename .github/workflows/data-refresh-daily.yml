name: Data refresh (daily)

# Pulls live data from BCRA / DolarAPI / ArgentinaDatos every day
# and commits to src/data/live/ — triggering a redeploy.

on:
  schedule:
    # 06:00 ART = 09:00 UTC (after BCRA publishes daily values)
    - cron: "0 9 * * *"
  workflow_dispatch: # allow manual trigger

concurrency:
  group: content-writers-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python data dependencies
        run: python3 -m pip install xlrd==2.0.2

      - name: Fetch all sources
        run: node scripts/data-sources/fetch-all.mjs

      # Gate de sanidad: compara los valores recién fetcheados (working tree)
      # contra el último commiteado (HEAD) + bounds absolutos + 2ª fuente.
      # FAIL (drift imposible / fuera de rango) → rompe el job y NO commitea el
      # dato sospechoso (la falla del workflow manda mail = alerta). WARN (2ª
      # fuente caída, drift moderado en serie periódica) → solo anota, no bloquea.
      - name: Sanity gate (valores, no solo frescura)
        run: |
          set +e
          node --experimental-strip-types scripts/validate-data-sanity.ts --strict --cross-source --out=/tmp/data-sanity.md
          code=$?
          cat /tmp/data-sanity.md || true
          if [ "$code" = "1" ]; then
            echo "::error::Sanity FAIL — dato fuera de rango o drift imposible. NO se commitea. Revisar el reporte de arriba."
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::Sanity WARN — revisar el reporte (no bloqueante)."
          fi
          exit 0

      - name: Commit if changed
        run: |
          # Verifica cambios en datos live (src/data/live/) Y en datasets públicos (public/datasets/)
          if git diff --quiet src/data/live/ public/datasets/; then
            echo "No changes — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live/ public/datasets/
          git commit -m "chore(data-live): refresh datos + datasets BCRA/INDEC/Dolar $(date -u +%Y-%m-%d)"
          git push
