name: IndexNow full re-submit (manual)

# ⚠️ SIN CRON A PROPÓSITO. Esto se corre A MANO y sólo para eventos sitewide
# (migración de slugs, revival masivo, recuperación tras un incidente).
#
# Antes esto era `indexnow-daily.yml`: un cron 09:30 UTC que mandaba las ~3100
# URLs del sitemap TODOS LOS DÍAS, hubiera o no cambios. Eso es el "batch mode"
# que Bing desaconseja — a genfy.net le mostró el warning literal por un cron
# equivalente de 1443 URLs/día (ver cerebro 2026-06-24_indexnow-streaming.md).
#
# El número que lo cierra: Bing le da a hacecuentas ~1700 submissions/mes
# (GetUrlSubmissionQuota → DailyQuota 0, MonthlyQuota 1700). Un solo `--all`
# gasta ~1,8 MESES de presupuesto de una. Re-enviar URLs que no cambiaron no
# acelera el crawl: compite contra las que sí cambiaron.
#
# El aviso de contenido nuevo/editado lo hace indexnow-push.yml (streaming,
# sólo lo que cambió) en cada push a main. Esto no reemplaza a eso.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all = sitemap entero (~3100 URLs, ~1,8 meses de quota). priority = sólo sitemap-priority.xml (~243).'
        required: false
        default: 'priority'
        type: choice
        options:
          - priority
          - all

permissions:
  contents: read
  issues: write

jobs:
  indexnow-full-resubmit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Push URLs to IndexNow (Bing + Yandex + Seznam + Naver)
        id: push
        run: |
          MODE="${{ github.event.inputs.mode || 'priority' }}"
          set -o pipefail
          if [ "$MODE" = "all" ]; then
            echo "::warning::Re-submit SITEWIDE (~3100 URLs). Sólo se justifica tras una migración de slugs."
            python3 scripts/indexnow-push.py --all 2>&1 | tee /tmp/indexnow.log
          else
            python3 scripts/indexnow-push.py 2>&1 | tee /tmp/indexnow.log
          fi
          if grep -qE '⚠️|❌|status=4[0-9]{2}|status=5[0-9]{2}' /tmp/indexnow.log; then
            echo "::error::IndexNow push tuvo errores"
            exit 1
          fi

      - name: Open GitHub issue if push failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 IndexNow full re-submit falló ($(date -u +'%Y-%m-%d'))"
          BODY=$(cat <<EOF
          El re-submit manual de IndexNow falló.

          **Workflow:** [\`${{ github.workflow }}\` run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Trigger:** ${{ github.event_name }}
          **Fecha:** $(date -u +'%Y-%m-%d %H:%M UTC')

          ## Log
          \`\`\`
          $(cat /tmp/indexnow.log 2>/dev/null | tail -30 || echo 'sin log')
          \`\`\`

          ## Próximos pasos
          1. Revisar el log completo en el run linkeado arriba
          2. Si es 403 → verificar que la key IndexNow sigue servida en /00e48c587b06495db41032c4797d9d39.txt
          3. Si es 422 → URLs malformadas en el sitemap
          4. Si es 429 → rate limit: es la señal de que estamos mandando de más, NO re-correr
          5. Si es 5xx → error transitorio del proveedor, esperar y re-correr
          EOF
          )
          EXISTING=$(gh issue list --label indexnow-failure --state open --json number --jq '.[0].number' || echo '')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label indexnow-failure || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
