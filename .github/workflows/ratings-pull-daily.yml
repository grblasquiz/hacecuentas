name: Ratings pull daily

# Corre ~11:15 UTC (08:15 AR) cada dia. Query D1 calc_votes, agrega ratings
# por slug con >= 5 votos, escribe db/ratings.json. Si hay cambios, commit +
# push a main para que el proximo deploy levante los ratings en el schema
# AggregateRating de cada calc.

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

concurrency:
  group: content-writers-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pull:
    name: Pull ratings desde D1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run ratings-pull
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/ratings-pull.ts

      - name: Commit y push si hay cambios
        run: |
          if [ -z "$(git status --porcelain db/ratings.json)" ]; then
            echo "Sin cambios en db/ratings.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/ratings.json
          git commit -m "chore(ratings): pull D1 votes → AggregateRating"
          git push

      - name: Auto-issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ratings-pull] fallo cron ${new Date().toISOString().split('T')[0]}`,
              body: `Workflow [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) fallo.\n\nVer logs para diagnostico.`,
              labels: ['ratings-failure'],
            });
