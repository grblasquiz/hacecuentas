name: Fútbol argentino — resultados y tablas

on:
  schedule:
    # Consulta cada 10 minutos, pero sólo publica cuando aparece un nuevo Final.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: futbol-argentino-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detectar partidos finalizados
        run: node scripts/fetch-futbol-argentino.mjs --final-only
      - name: Publicar sólo si terminó un partido
        id: publish
        run: |
          if git diff --quiet -- src/data/live/futbol-argentino.json; then
            echo "No terminó ningún partido"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live/futbol-argentino.json
          git commit -m "data(futbol): actualizar resultados y posiciones"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Desplegar el nuevo resultado
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
