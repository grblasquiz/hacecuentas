name: Bing Submit daily push

# Cron diario que pushea sitemap-priority.xml al Bing Webmaster Submit API.
# Complementa IndexNow:
#   - IndexNow (indexnow-push.yml) señala a múltiples engines las URLs que cambian.
#   - Bing Submit (este) las mete directo al índice prioritario de Bing.
#
# Quota Bing Submit: 10.000 URLs/día (sitio nuevo arranca con menos, va subiendo).
# El script bing-submit.py lee sitemap-priority.xml por default (~178 URLs)
# para no quemar quota.
#
# Secret requerido: BING_WEBMASTER_API_KEY (configurado en repo settings).
# Token se obtiene desde Bing Webmaster Tools → Settings → API Access.

on:
  schedule:
    # 10:00 UTC (07:00 AR). Antes se elegía para caer 30 min después del cron
    # indexnow-daily; ese cron ya no existe (IndexNow pasó a streaming por push).
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        required: false
        default: 'priority'
        type: choice
        options:
          - priority  # solo sitemap-priority.xml (default, ~178 URLs)
          - all       # todos los sitemaps (cuidado quota)

permissions:
  contents: read
  issues: write

jobs:
  bing-submit-daily:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certifi
        run: pip install --quiet certifi

      - name: Validate required secrets
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "$BING_WEBMASTER_API_KEY" ]; then
            echo "::error::Secret BING_WEBMASTER_API_KEY no está configurado en repo settings. Settings → Secrets → Actions → New repository secret."
            exit 1
          fi
          echo "✓ Secret BING_WEBMASTER_API_KEY presente (longitud: ${#BING_WEBMASTER_API_KEY})"

      - name: Push URLs to Bing Webmaster Submit API
        id: push
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'priority' }}"
          set -o pipefail
          if [ "$MODE" = "all" ]; then
            python3 scripts/bing-submit.py --all 2>&1 | tee /tmp/bing-submit.log
          else
            python3 scripts/bing-submit.py 2>&1 | tee /tmp/bing-submit.log
          fi
          # El script ya consulta GetUrlSubmissionQuota antes de enviar, así que
          # rate-limit no debería ocurrir. Si igual pasa (FATAL) o devuelve
          # exit != 0, el step falla por sí mismo (pipefail). Solo grepeamos
          # FATAL como red de seguridad por si el script logea pero no exitea.
          if grep -q '^FATAL' /tmp/bing-submit.log; then
            echo "::error::Bing Submit push tuvo errores fatales"
            exit 1
          fi

      - name: Open GitHub issue if push failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Bing Submit daily push falló ($(date -u +'%Y-%m-%d'))"
          BODY=$(cat <<EOF
          El cron diario de Bing Submit API falló.

          **Workflow:** [\`${{ github.workflow }}\` run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Trigger:** ${{ github.event_name }}
          **Fecha:** $(date -u +'%Y-%m-%d %H:%M UTC')

          ## Log
          \`\`\`
          $(cat /tmp/bing-submit.log 2>/dev/null | tail -30 || echo 'sin log')
          \`\`\`

          ## Próximos pasos
          1. Revisar el log completo en el run linkeado arriba
          2. Si es 401/403 → renovar BING_WEBMASTER_API_KEY en repo secrets (Bing Webmaster Tools → Settings → API Access)
          3. Si es 422 → URLs malformadas en sitemap-priority.xml
          4. Si es 429 → quota diaria excedida, cambiar a mode=priority o esperar 24h
          5. Si es 5xx → error transitorio Bing, re-correr manualmente con workflow_dispatch
          EOF
          )
          EXISTING=$(gh issue list --label bing-submit-failure --state open --json number --jq '.[0].number' || echo '')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bing-submit-failure || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
