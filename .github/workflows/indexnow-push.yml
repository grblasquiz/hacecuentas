name: IndexNow push (post-deploy)

# Pushea URLs al IndexNow API (Bing + Yandex) después de cada push a main.
# Bing crawlea más rápido que Google y sus señales a veces disparan crawls de Google.
# También genera tráfico directo desde Bing.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  push-to-indexnow:
    runs-on: ubuntu-latest
    # Espera 3 min para que Cloudflare termine el deploy antes de notificar a Bing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 → necesario para git diff HEAD~1..HEAD y detectar
          # qué calcs fueron editadas en este push (Step "changed URLs first").
          fetch-depth: 2

      - name: Wait for CF Pages deploy
        run: sleep 180

      - name: Push CHANGED calc URLs first (immediate)
        run: |
          # Detecta qué calcs cambiaron en este push y las pushea PRIMERO a IndexNow.
          # Beneficio: Bing/Yandex priorizan re-crawl de URLs editadas en vez de
          # perdérselas entre las 2500 URLs del --all push posterior.
          set -o pipefail
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/content/calcs/*.json' 'src/content/calcs-en/*.json' 'src/content/calcs-pt/*.json' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "No calc edits in this push — skipping changed-first step"
            exit 0
          fi
          URLS=""
          for f in $CHANGED; do
            if [ ! -f "$f" ]; then continue; fi  # archivo borrado
            slug=$(python3 -c "import json,sys;d=json.load(open('$f'));print(d.get('slug',''))" 2>/dev/null || true)
            if [ -n "$slug" ]; then URLS="$URLS /$slug"; fi
          done
          if [ -z "$URLS" ]; then
            echo "Sin slugs validos en calcs cambiadas"
            exit 0
          fi
          echo "Changed-first push: $URLS"
          python3 scripts/indexnow-push.py $URLS 2>&1 | tee -a /tmp/indexnow.log
          if grep -qE '⚠️|❌|status=4[0-9]{2}|status=5[0-9]{2}' /tmp/indexnow.log; then
            echo "::error::IndexNow changed-first push falló"; exit 1
          fi

      - name: Push priority URLs to IndexNow
        run: |
          set -o pipefail
          python3 scripts/indexnow-push.py 2>&1 | tee -a /tmp/indexnow.log
          if grep -qE '⚠️|❌|status=4[0-9]{2}|status=5[0-9]{2}' /tmp/indexnow.log; then
            echo "::error::IndexNow priority push falló"; exit 1
          fi

      - name: Push all URLs (every push)
        run: |
          set -o pipefail
          python3 scripts/indexnow-push.py --all 2>&1 | tee -a /tmp/indexnow.log
          if tail -20 /tmp/indexnow.log | grep -qE '⚠️|❌|status=4[0-9]{2}|status=5[0-9]{2}'; then
            echo "::error::IndexNow --all push falló"; exit 1
          fi

      - name: Open GitHub issue if push failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 IndexNow post-deploy push falló"
          BODY=$(cat <<EOF
          El push IndexNow tras el deploy ($GITHUB_SHA) falló.

          **Workflow:** [\`${{ github.workflow }}\` run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Commit:** \`${{ github.sha }}\`
          **Fecha:** $(date -u +'%Y-%m-%d %H:%M UTC')

          ## Log
          \`\`\`
          $(tail -30 /tmp/indexnow.log 2>/dev/null || echo 'sin log')
          \`\`\`
          EOF
          )
          EXISTING=$(gh issue list --label indexnow-failure --state open --json number --jq '.[0].number' || echo '')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label indexnow-failure 2>/dev/null || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
