name: IndexNow manual recovery

# Los envíos automáticos viven al final de deploy.yml: después del smoke test.
# Este workflow sólo reintenta un rango explícito ya publicado.
on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Commit anterior ya publicado (exclusivo)'
        required: true
      after:
        description: 'Commit final ya publicado (inclusivo)'
        required: true

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run sitemap
      - name: Reintentar URLs del rango publicado
        env:
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
        run: |
          git merge-base --is-ancestor "$AFTER" HEAD
          python3 scripts/indexnow-push.py --git-changed "$BEFORE" "$AFTER"
