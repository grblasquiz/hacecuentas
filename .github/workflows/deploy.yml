name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Paths que no afectan el build de produccion: NO redeployar.
    # chore(reddit-queue) solo toca docs/reddit-queue-*.md — ahorra ~15min/dia.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'cerebro/**'
  workflow_dispatch:  # permite correr manual desde Github UI

concurrency:
  # Encola deploys (no cancela el en curso). Si cancelamos cuando llega un
  # nuevo push, los crons (data-update-daily, refresh-freshness, indexnow-*)
  # que pushean dentro de la ventana de build pisan al deploy original y
  # nada llega a prod. Era exactamente lo que pasaba 2026-04-26/27: 4 deploys
  # seguidos quedaron `cancelled` y wrangler tuvo que ir a mano.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build local: ~90s. CI con npm ci + 2700+ páginas: ~6-10 min observado.
    # Antes era 15 → cortaba. Subimos a 30 con margen.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 trae toda la historia del repo. La necesita
          # scripts/generate-sitemap.ts para usar `git log` como fuente
          # de `lastmod` por archivo — sino el mtime del checkout es
          # uniforme y el sitemap reporta "todo cambió hoy" (mala señal
          # para Google crawl budget).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache para compute-related (prebuild). Sin esto, cada deploy gasta ~150s
      # recalculando el grafo TF-IDF de related-auto. El cache hit lo baja a <2s.
      # Key: hash de todos los calc JSONs. Si cambia uno solo, recompila.
      # El pre-commit hook (.githooks/pre-commit) deberia mantener el committed
      # related-auto.{json,hash} en sync, pero esto es safety net.
      - name: Cache related-auto (TF-IDF)
        uses: actions/cache@v4
        with:
          path: |
            src/lib/related-auto.json
            src/lib/related-auto.hash
          key: related-auto-${{ hashFiles('src/content/calcs/**/*.json') }}

      # Cache OG images (~8500 PNGs en public/og/). Generarlos via Sharp/Resvg
      # tarda ~60-90s en CI. El hash key invalida cuando cambia la fuente
      # (template, fuentes, listado de slugs). Si solo cambia un JSON de calc,
      # no se regenera todo.
      - name: Cache OG images
        uses: actions/cache@v4
        with:
          path: public/og
          key: og-images-v1-${{ hashFiles('scripts/generate-og-images.ts', 'scripts/generate-og-images.mjs', 'public/og-default.png') }}-${{ hashFiles('src/content/calcs/**/*.json', 'src/content/calcs-*/**/*.json') }}
          restore-keys: |
            og-images-v1-${{ hashFiles('scripts/generate-og-images.ts', 'scripts/generate-og-images.mjs', 'public/og-default.png') }}-

      # Cache Vite/Astro internal cache. Acelera resolución de módulos +
      # transformaciones (TypeScript, JSON, etc.) entre builds. Key dinámico
      # por package-lock para invalidar cuando cambian deps.
      - name: Cache Astro + Vite internal
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.cache
            node_modules/.vite
          key: astro-vite-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.*', 'tsconfig.json') }}
          restore-keys: |
            astro-vite-${{ runner.os }}-

      # Cache search-index.json — generarlo escanea 4000+ calcs. ~10s saved.
      - name: Cache search-index
        uses: actions/cache@v4
        with:
          path: public/search-index.json
          key: search-index-${{ hashFiles('src/content/calcs/**/*.json', 'src/content/calcs-*/**/*.json', 'scripts/generate-search-index.ts') }}

      - name: Build
        # Verbose timing: imprime tiempo de cada sub-step de prebuild + astro build.
        # Si futuro deploy vuelve a colgar, queda registro de qué etapa fue.
        env:
          # PUBLIC_MS_CLARITY_ID se inyecta en build-time vía import.meta.env
          # (ver src/layouts/Layout.astro). Sin el secret la condición evalúa
          # falso y el script no se renderiza — no rompe el build.
          PUBLIC_MS_CLARITY_ID: ${{ secrets.PUBLIC_MS_CLARITY_ID }}
        run: |
          set -e
          echo "::group::env info"
          node --version
          npm --version
          free -h || true
          df -h .
          echo "::endgroup::"
          echo "::group::npm run build (with /usr/bin/time)"
          /usr/bin/time -v npm run build 2>&1 || EXIT=$?
          echo "::endgroup::"
          exit ${EXIT:-0}

      # Bundle size budget: previene regresiones grandes. Threshold relajado
      # para tolerar edge cases (404, offline, redirect HTMLs); el smoke test
      # post-deploy es la red de seguridad principal para catastrofes.
      - name: Bundle size budget
        run: |
          set -e
          python3 - <<'PYEOF'
          import os, sys
          BUDGETS = {
              'dist/server/_worker.js': 5 * 1024 * 1024,      # 5 MB worker
              'dist/server/entry.mjs':  1 * 1024 * 1024,      # entry stub
          }
          MAX_HTML = 200 * 1024  # 200KB warn-only
          MAX_BROKEN_BODY = 500  # solo HTMLs verdaderamente vacíos (< 500b)
          # Threshold: fail si > 30 broken HTMLs (regresión masiva tipo schemaDescription = 215)
          BROKEN_THRESHOLD = 30
          # Excluir HTMLs legítimamente pequeños (404 placeholder, offline, etc.)
          BROKEN_EXCLUDE = {'404.html', 'offline.html', 'index.html'}

          fails = []

          for path, max_size in BUDGETS.items():
              if not os.path.exists(path):
                  continue
              size = os.path.getsize(path)
              kb = size / 1024
              status = '✓' if size <= max_size else '✗'
              print(f'  {status} {path}: {kb:.1f}KB (budget {max_size/1024:.0f}KB)')
              if size > max_size:
                  fails.append(f'{path}: {kb:.1f}KB > {max_size/1024:.0f}KB')

          big_htmls = []
          broken_htmls = []
          for root, dirs, files in os.walk('dist/client'):
              for f in files:
                  if not f.endswith('.html') or f in BROKEN_EXCLUDE:
                      continue
                  fp = os.path.join(root, f)
                  size = os.path.getsize(fp)
                  if size > MAX_HTML:
                      big_htmls.append((fp.replace('dist/client/', ''), size))
                  elif size < MAX_BROKEN_BODY:
                      broken_htmls.append((fp.replace('dist/client/', ''), size))

          if len(broken_htmls) > BROKEN_THRESHOLD:
              fails.append(f'{len(broken_htmls)} HTMLs < {MAX_BROKEN_BODY}b (> threshold {BROKEN_THRESHOLD})')
              for path, size in sorted(broken_htmls)[:10]:
                  print(f'  ✗ BROKEN {path}: {size}b')
              if len(broken_htmls) > 10:
                  print(f'  ... +{len(broken_htmls)-10} more')
          elif broken_htmls:
              print(f'\n  ⚠️  {len(broken_htmls)} HTMLs < {MAX_BROKEN_BODY}b (warn, dentro de threshold {BROKEN_THRESHOLD})')
              for path, size in sorted(broken_htmls)[:5]:
                  print(f'     {size}b  {path}')

          if big_htmls:
              print(f'\n  ⚠️  {len(big_htmls)} HTMLs > {MAX_HTML/1024:.0f}KB (warn):')
              for path, size in sorted(big_htmls, key=lambda x: -x[1])[:5]:
                  print(f'     {size/1024:.0f}KB  {path}')

          if fails:
              print(f'\n❌ Bundle budget FAIL ({len(fails)} issues)')
              for f in fails:
                  print(f'   {f}')
              sys.exit(1)
          print('\n✅ Bundle size dentro del budget')
          PYEOF

      # El adapter @astrojs/cloudflare genera DOS configs en el build:
      #   1. dist/server/wrangler.json  ← la que queremos usar (workingDirectory)
      #   2. .wrangler/deploy/config.json  ← "deploy config" apuntando a 1
      # Wrangler ve las dos con base paths distintos y aborta con:
      #   "Found both a user configuration file at \"wrangler.json\"
      #    and a deploy configuration file at \"../../.wrangler/deploy/config.json\".
      #    But these do not share the same base path..."
      # Eliminamos el deploy config para que wrangler use solo el wrangler.json
      # de dist/server/.
      - name: Remove stale .wrangler/deploy/config.json
        run: rm -rf .wrangler/deploy

      # Diagnóstico pre-deploy: verifica que el token CF es válido y lista
      # los scopes/permission groups. Si la próxima step falla por 10000
      # (auth) esto deja un rastro claro en el log sin exponer el secret.
      # Imprimimos solo metadatos (id, status, scopes) — nunca el token.
      - name: Verify Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CF_TOKEN" ]; then echo "ERROR: CLOUDFLARE_API_TOKEN vacío en GH Secrets"; exit 1; fi
          if [ -z "$CF_ACCT" ]; then echo "ERROR: CLOUDFLARE_ACCOUNT_ID vacío en GH Secrets"; exit 1; fi

          # Whitespace/newline check — copy-paste al GH Secret UI suele dejar \n al final.
          CLEAN_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')
          if [ "${#CLEAN_TOKEN}" != "${#CF_TOKEN}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN contiene whitespace/newlines (${#CF_TOKEN} → ${#CLEAN_TOKEN})"
            echo "Re-pegar el token en GH → Settings → Secrets sin saltos de línea."
            exit 1
          fi
          echo "OK token len: ${#CF_TOKEN} | account id len: ${#CF_ACCT}"

          echo "--- /user/tokens/verify ---"
          VERIFY=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN")
          echo "$VERIFY" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',{}); ok=d.get('success'); print('token id:',r.get('id','?'),'status:',r.get('status','?'),'ok:',ok); sys.exit(0 if ok else 1)"

          echo "--- probe Workers Scripts: GET /accounts/\$CF_ACCT/workers/scripts ---"
          PROBE_HTTP=$(curl -sS -o /tmp/cf-probe.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/workers/scripts" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "HTTP $PROBE_HTTP"
          python3 -c "import json,sys; d=json.load(open('/tmp/cf-probe.json')); print('success:',d.get('success'),'errors:',d.get('errors')); sys.exit(0 if d.get('success') else 1)"

          echo "--- probe KV: GET /accounts/\$CF_ACCT/storage/kv/namespaces ---"
          curl -sS -o /tmp/kv-probe.json -w "HTTP %{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/storage/kv/namespaces" \
            -H "Authorization: Bearer $CF_TOKEN"
          python3 -c "import json; d=json.load(open('/tmp/kv-probe.json')); print('success:',d.get('success'),'errors:',d.get('errors'))" || true

      # Reemplazamos wrangler-action@v3 por npx directo para poder ver el
       # stderr completo en el log (la action envuelve la salida y con
      # runs anónimos no podemos leer los logs detallados del job).
      - name: Deploy to Cloudflare Workers
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Con output:'server' el adapter @astrojs/cloudflare genera un
        # wrangler.json en dist/server/ con paths relativos a ese dir
        # (main: entry.mjs, assets: ../client). Por eso corremos wrangler
        # DESDE dist/server/ — sino los paths no resuelven.
        run: |
          echo "--- wrangler version ---"
          npx wrangler@latest --version
          echo "--- dist/server contents ---"
          ls -la
          echo "--- wrangler.json ---"
          cat wrangler.json | python3 -m json.tool | head -40
          echo "--- deploy ---"
          npx wrangler@latest deploy 2>&1

      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | grep -q '"success":true' && echo "✅ Cache purgado"

      # Smoke test post-deploy: verifica 60 URLs en paralelo cross-locale.
      # Detecta regresiones masivas (tipo schemaDescription bug 18/5 → 216
      # HTMLs rotos). Threshold relajado a 5% + retry once para tolerar
      # race conditions de CF propagation post-deploy.
      - name: Smoke test post-deploy
        run: |
          set -e
          echo "Esperando 60s a que CF Pages termine de propagar..."
          sleep 60
          python3 - <<'PYEOF'
          import sys, re, ssl, concurrent.futures, urllib.request
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          # Cobertura cross-locale + sitemap + casos críticos previos.
          # AR root: home, top calcs por GSC traffic, categorías top, /argentina/X
          # Locales: 1-2 calcs por locale para detectar bugs locale-specific.
          urls = [
              # AR root
              '/', '/calculadora-aguinaldo-sac', '/calculadora-imc', '/calculadora-interes-compuesto',
              '/categoria/finanzas', '/categoria/salud', '/categoria/educacion', '/categoria/medio-ambiente',
              '/argentina/salta', '/argentina/cordoba', '/argentina/buenos-aires',
              '/blog', '/guias', '/sobre-nosotros', '/politica-editorial',
              # English (top traffic + categorías sensibles del bug schemaDescription)
              '/en/', '/en/bmi-calculator', '/en/compound-interest-calculator',
              # NOTE: 5 URLs /en/ removidas del smoke test (2026-05-20) tras commit
              # 8eb6441a "mass noindex 973 calcs rechazadas por Google". Estaban como
              # regresión 18/5 pero fueron noindex-eadas a propósito y ahora dan 404.
              # Originales: vitamin-d-dosage-daily-sun-exposure-age,
              # premature-infant-corrected-age, choking-heimlich-age-maneuver,
              # macros-dash-hypertension, a1c-to-average-glucose.
              # Spanish
              '/es/', '/es/calculadora-becas-mec-2026-espana-renta-familiar-rendimiento',
              # Mexican
              '/mx/', '/mx/calculadora-afore-saldo-pension-jubilacion-mexico-2026',
              # Chilean
              '/cl/', '/cl/calculadora-acciones-bolsa-santiago-chile-comisiones-broker',
              # Colombian
              '/co/', '/co/calculadora-ahorro-en-pesos-vs-cdt-vs-fic-vs-tes-colombia',
              # Portuguese
              '/pt/', '/pt/abono-salarial-pis-pasep-elegibilidade-valor',
              # Sitemaps + feeds
              '/sitemap.xml', '/sitemap-core.xml', '/sitemap-priority.xml',
              '/rss.xml', '/feed.json',
              # Technical files
              '/robots.txt', '/llms.txt', '/.well-known/security.txt',
              '/manifest.webmanifest',
          ]
          MIN_BODY_BYTES = 1000  # menos = error de worker (316b case)

          def check(url):
              full = f'https://hacecuentas.com{url}'
              try:
                  req = urllib.request.Request(full, headers={'User-Agent': 'HC-SmokeTest/2.0'})
                  r = urllib.request.urlopen(req, timeout=20, context=ctx)
                  status = r.status
                  body = r.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return (url, False, f'error: {e}')
              if status != 200:
                  return (url, False, f'status {status}')
              # Body size sanity check — el bug schemaDescription emitía 316 bytes.
              if len(body) < MIN_BODY_BYTES and not url.endswith(('.txt', '.json', '.xml', '.webmanifest')):
                  return (url, False, f'body too small ({len(body)} bytes — Worker error?)')
              if url.endswith('.xml'):
                  # /rss.xml es RSS feed (<rss>), no sitemap. El resto debe ser
                  # sitemap (<urlset>) o índice de sitemaps (<sitemapindex>).
                  if '<urlset' not in body and '<sitemapindex' not in body and '<rss' not in body:
                      return (url, False, 'not a sitemap or RSS XML')
                  return (url, True, 'ok')
              if url.endswith(('.txt', '.json', '.webmanifest')):
                  return (url, True, 'ok')
              # HTML pages
              m = re.search(r'<title[^>]*>(.*?)</title>', body, re.S)
              if not m or 'undefined' in m.group(1).lower() or len(m.group(1).strip()) < 5:
                  return (url, False, f'<title> roto: {m.group(1)[:80] if m else "ausente"!r}')
              m = re.search(r'<h1[^>]*>(.*?)</h1>', body, re.S)
              if not m:
                  return (url, False, 'no hay <h1>')
              text = re.sub(r'<[^>]+>', '', m.group(1)).strip()
              if not text:
                  return (url, False, '<h1> sin texto')
              if 'undefined' in text.lower():
                  return (url, False, f'<h1> "undefined": {text[:80]!r}')
              m = re.search(r'<meta\s+name="description"\s+content="([^"]*)"', body)
              if m and ('undefined' in m.group(1).lower() or len(m.group(1).strip()) < 10):
                  return (url, False, f'meta description roto: {m.group(1)[:80]!r}')
              return (url, True, 'ok')

          # 10 workers paralelos — 60 URLs en ~6s vs 60s secuencial
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              results = list(ex.map(check, urls))

          fails = [r for r in results if not r[1]]

          # Retry once para URLs que fallaron — race conditions de CF propagation
          # son comunes en primer hit post-deploy. Después de 10s la mayoría se
          # estabilizan.
          if fails:
              print(f'\nRetry {len(fails)} URLs que fallaron en primer pass (10s wait)...')
              import time
              time.sleep(10)
              retry_urls = [r[0] for r in fails]
              with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
                  retry_results = list(ex.map(check, retry_urls))
              # Reemplazar fails con resultados del retry
              fails = [r for r in retry_results if not r[1]]

          print(f'Smoke test: {len(urls)} URLs probadas, {len(fails)} fallaron tras retry')
          for url, ok, msg in fails:
              print(f'  ✗ {url}: {msg}')

          # Threshold: tolerar hasta 5% (~3 URLs en 60). Race conditions CF
          # ocasionales no rompen el deploy; regresión masiva (>5%) sí.
          if len(fails) / len(urls) > 0.05:
              print(f'\n❌ Smoke test FAIL: {len(fails)}/{len(urls)} ({100*len(fails)/len(urls):.1f}%) supera el 5% threshold')
              sys.exit(1)
          if fails:
              print(f'\n⚠️  {len(fails)}/{len(urls)} fallaron pero dentro del 5% threshold — no bloquea deploy')
          else:
              print('\n✅ Smoke test OK')
          PYEOF

      # Bing Webmaster Submit URL — pushea sitemap-priority al índice prioritario.
      # Quota Bing: 10.000 URLs/día. sitemap-priority tiene ~180 URLs, holgura
      # enorme. Non-blocking: continue-on-error en caso de quota o API issue.
      - name: Bing Webmaster URL Submission
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "$BING_WEBMASTER_API_KEY" ]; then
            echo "⚠️  BING_WEBMASTER_API_KEY no configurado — skip"
            exit 0
          fi
          python3 scripts/bing-submit.py 2>&1 || echo "⚠️  Bing submit falló (no bloqueante)"
