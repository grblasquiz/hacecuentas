# Worker independiente: motor de "avisame cuando este resultado cambie".
# Cada día reejecuta las alertas activas contra el endpoint de compute del sitio
# y, si el resultado headline cambió (por una actualización normativa deployada),
# manda un mail con el diff concreto. 100% Cloudflare, sin terceros.
#
# Deploy: cd workers/alerts-recompute && npx wrangler deploy --config ./wrangler.toml
#   (el --config es obligatorio: sin él wrangler agarra el wrangler.jsonc del SITIO)
#
# Requisitos para ENVIAR (ya cumplidos por el newsletter): Workers Paid +
# hacecuentas.com onboardeado en Email > Email Sending (binding EMAIL).
name = "hacecuentas-alerts-recompute"
main = "index.mjs"
compatibility_date = "2026-06-01"
workers_dev = true

# Diario 14:30 UTC = 11:30 ART (después de la ventana típica de data-refresh+deploy):
# alertas por email + push. Los intradía (12/15/18/21 UTC = 9-18 ART) sólo
# chequean topics de Web Push (dólar/mundial) — baratos si no hay novedad.
[triggers]
crons = ["30 14 * * *", "0 12,15,18,21 * * *"]

# Cloudflare Email Service — binding de envío (mismo que el newsletter).
[[send_email]]
name = "EMAIL"

[vars]
ALERTS_FROM = "Hacé Cuentas <novedades@hacecuentas.com>"
SITE_BASE = "https://hacecuentas.com"
# Web Push (VAPID). La clave PÚBLICA no es secreta (viaja en cada suscripción del
# browser); la PRIVADA es secret: npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BJU0dNu2PLYBkx2KmNrgfLKiZ3YM_nrf6n8qQEI7CU3a_HMATTSdk8tyjY7lOtzaOAt__ATnfzbu2lU0RfGCf1M"
VAPID_SUBJECT = "mailto:novedades@hacecuentas.com"

# Misma base D1 que el sitio (hacecuentas-forms) — bind por id.
[[d1_databases]]
binding = "DB"
database_name = "hacecuentas-forms"
database_id = "73216cf9-dba3-4c16-875c-4073d8184bcd"
