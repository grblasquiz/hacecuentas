<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Régimen tributario Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#4e7e57}.hero{background:#edf7ec}.kicker{color:var(--a)}.funnel{display:grid;gap:10px}.level{margin:auto;padding:16px;text-align:center;background:white;border:1px solid #d7e3d6;border-radius:14px}.level:nth-child(1){width:100%}.level:nth-child(2){width:86%}.level:nth-child(3){width:72%}.level:nth-child(4){width:58%}.level.off{opacity:.3;text-decoration:line-through}.primary{background:var(--a)}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Negocio</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Descartá antes de elegir</div><h1>¿Qué régimen tributario encaja con tu negocio?</h1><p>Ingresos, clientes y estructura eliminan opciones hasta dejar una recomendación explicable.</p></div></section><main class="work"><div class="shell grid2"><aside class="card"><div class="field"><label>Ventas mensuales (S/)</label><input id="sales" type="number" value="18000"></div><div class="field"><label>Vendés al consumidor final</label><select id="final"><option value="1">Sí</option><option value="0">No, emito facturas</option></select></div><div class="field"><label>Trabajadores</label><input id="staff" type="number" value="2"></div><button id="calc" class="primary">Filtrar regímenes</button></aside><div><div class="funnel" id="funnel"></div><div class="notice card" id="answer"></div></div></div></main><footer class="site-footer"><div class="shell">Validá topes vigentes con SUNAT.</div></footer><script>function go(){let s=+sales.value,f=+final.value,n=+staff.value,rus=f&&s<=8000,re=s<=525000/12&&n<=10,mype=s<=1700*5350/12;let a=[["Nuevo RUS",rus],["Régimen Especial",re],["MYPE Tributario",mype],["Régimen General",true]];funnel.innerHTML=a.map(x=>`<div class="level ${x[1]?"":"off"}">${x[1]?"✓":"×"} ${x[0]}</div>`).join("");let best=rus?"Nuevo RUS":re?"Régimen Especial":mype?"MYPE Tributario":"Régimen General";answer.innerHTML=`<b>Primera opción a revisar: ${best}</b><p>No es una elección automática: compará libros, comprobantes y deducciones.</p>`}calc.onclick=go;[sales,final,staff].forEach(x=>x.oninput=go);go()</script></body></html>
