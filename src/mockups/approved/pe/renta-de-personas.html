<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renta de personas Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#7d568f}.hero{background:#f7eef9}.kicker{color:var(--a)}.streams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stream{padding:18px;border-radius:22px;background:white}.stream input{margin-top:10px}.river{margin-top:18px;background:#e8dcec;border-radius:30px;padding:22px;display:flex;justify-content:space-between}.primary{background:var(--a)}@media(max-width:760px){.streams{grid-template-columns:1fr 1fr}}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Renta</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Cuatro fuentes, una declaración</div><h1>¿De dónde viene tu plata?</h1><p>Planilla, honorarios, alquileres y capital tienen reglas distintas antes de juntarse.</p></div></section><main class="work"><div class="shell"><div class="streams"><label class="stream">👔 Quinta<input id="fifth" type="number" value="60000"></label><label class="stream">🧾 Cuarta<input id="fourth" type="number" value="12000"></label><label class="stream">🏠 Primera<input id="first" type="number" value="0"></label><label class="stream">📈 Segunda<input id="second" type="number" value="0"></label></div><div class="river"><div><small>Ingreso anual</small><h2 id="gross"></h2></div><div><small>Impuesto estimado</small><h2 id="tax"></h2></div><button id="calc" class="primary">Recalcular</button></div></div></main><footer class="site-footer"><div class="shell">Estimación simplificada; cada categoría admite deducciones propias.</div></footer><script>const sol=n=>"S/ "+Math.round(n).toLocaleString("es-PE");function go(){let a=+fifth.value,b=+fourth.value,c=+first.value,d=+second.value,total=a+b+c+d,t=Math.max(0,(a+b*.8-7*5350)*.08)+c*.05+d*.05;gross.textContent=sol(total);tax.textContent=sol(t)}calc.onclick=go;[fifth,fourth,first,second].forEach(x=>x.oninput=go);go()</script></body></html>
