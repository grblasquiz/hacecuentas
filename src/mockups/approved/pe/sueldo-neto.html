<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sueldo neto Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#267968}.hero{background:#eaf8f4}.kicker{color:var(--a)}.payslip{background:#fff;padding:28px;border-left:10px solid var(--a)}.flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.primary{background:var(--a)}@media(max-width:700px){.flow{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Sueldo</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Del bruto a tu cuenta</div><h1>Tu sueldo, los descuentos y el costo para la empresa</h1><p>Compará ONP y AFP sin perder de vista lo que aporta el empleador.</p></div></section><main class="work"><div class="shell grid2"><aside class="card"><div class="field"><label>Sueldo bruto</label><input id="salary" type="number" value="4200"></div><div class="field"><label>Sistema</label><select id="system"><option value=".13">ONP</option><option value=".117">AFP</option></select></div><button id="calc" class="primary">Actualizar boleta</button></aside><div class="payslip"><div class="flow"><div class="metric"><small>Bruto</small><strong id="gross"></strong></div><b>→</b><div class="metric"><small>Neto</small><strong id="net"></strong></div></div><div class="rows"><div class="row"><span>Descuento previsional</span><b id="pension"></b></div><div class="row"><span>EsSalud empleador</span><b id="health"></b></div><div class="row"><span>Costo empresa</span><b id="cost"></b></div></div></div></div></main><footer class="site-footer"><div class="shell">Puede haber quinta categoría y conceptos no remunerativos.</div></footer><script>const sol=n=>"S/ "+Math.round(n).toLocaleString("es-PE");function go(){let s=+salary.value,p=s*+system.value;gross.textContent=sol(s);pension.textContent="- "+sol(p);net.textContent=sol(s-p);health.textContent=sol(s*.09);cost.textContent=sol(s*1.09)}calc.onclick=go;[salary,system].forEach(x=>x.oninput=go);go()</script></body></html>
