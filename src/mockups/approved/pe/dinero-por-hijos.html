<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinero por hijos Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#c15775}.hero{background:#fff0f4}.kicker{color:var(--a)}.family{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{background:white;padding:20px;border-radius:50px 50px 20px 20px;text-align:center;border:1px solid #f0cbd6}.person.on{box-shadow:0 14px 30px #c1577522}.primary{background:var(--a)}@media(max-width:700px){.family{grid-template-columns:1fr 1fr}}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Familia</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Mapa de derechos familiares</div><h1>Tengo un hijo: ¿qué dinero o licencia corresponde?</h1><p>Separá nacimiento, asignación familiar, licencia del padre y pensión alimentaria.</p></div></section><main class="work"><div class="shell"><div class="card grid3"><div class="field"><label>Remuneración mensual</label><input id="salary" type="number" value="2800"></div><div class="field"><label>Hijos menores</label><input id="kids" type="number" value="1"></div><button id="calc" class="primary">Ver derechos</button></div><div class="family" id="family"></div></div></main><footer class="site-footer"><div class="shell">La cuota alimentaria real la fija acuerdo o autoridad competente.</div></footer><script>const sol=n=>"S/ "+Math.round(n).toLocaleString("es-PE");function go(){let s=+salary.value,k=+kids.value;family.innerHTML=[["🤱","Maternidad","98 días subsidiados"],["👨‍🍼","Paternidad","10 días"],["👶","Asignación",sol(k?113:0)+"/mes"],["⚖️","Alimentos","Referencia "+sol(s*.3)]].map(x=>`<article class="person on"><b>${x[0]} ${x[1]}</b><p>${x[2]}</p></article>`).join("")}calc.onclick=go;[salary,kids].forEach(x=>x.oninput=go);go()</script></body></html>
