<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trámites del Estado Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#536d9b}.hero{background:#eef3fb}.kicker{color:var(--a)}.queue{display:grid;gap:12px}.ticket{display:grid;grid-template-columns:70px 1fr auto;gap:15px;align-items:center;background:white;padding:16px;border-radius:18px}.ticket i{font-style:normal;font-size:1.5rem;font-weight:950;color:var(--a)}.docs{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--a)}@media(max-width:600px){.ticket{grid-template-columns:55px 1fr}.ticket>strong{grid-column:2}}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Trámites</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Tu turno, sin sorpresas</div><h1>¿Cuánto cuesta y qué llevar?</h1><p>Elegí el trámite y salí con tasa, documentos, plazo y canal de atención.</p></div></section><main class="work"><div class="shell grid2"><aside class="card"><div class="field"><label>Trámite</label><select id="process"><option value="120|Pasaporte|DNI vigente; pago de tasa|1 día">Pasaporte</option><option value="30|Duplicado DNI|Foto; denuncia si corresponde|7 días">Duplicado de DNI</option><option value="214|Licencia de conducir|Examen médico; evaluación|3 días">Licencia</option><option value="535|Multa 10% UIT|Código de infracción|Inmediato">Multa UIT</option></select></div><button id="calc" class="primary">Preparar turno</button></aside><div class="queue" id="queue"></div></div></main><footer class="site-footer"><div class="shell">Tasas referenciales; verificá la entidad competente.</div></footer><script>function go(){let [cost,name,docs,time]=process.value.split("|");queue.innerHTML=`<div class=ticket><i>01</i><div><b>${name}</b><p>Elegí sede o canal digital</p></div><strong>S/ ${cost}</strong></div><div class=ticket><i>02</i><div><b>Documentos</b><div class=docs>${docs.split(";").map(x=>`<span class=chip>${x}</span>`).join("")}</div></div><strong>${time}</strong></div><div class=ticket><i>03</i><div><b>Confirmá el pago y guardá el comprobante</b></div><strong>Listo</strong></div>`}calc.onclick=go;process.onchange=go;go()</script></body></html>
