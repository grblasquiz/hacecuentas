<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regímenes laborales Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#3f7186}.hero{background:#eaf5f7}.kicker{color:var(--a)}.badges{display:flex;gap:12px;flex-wrap:wrap}.badge{flex:1;min-width:190px;padding:22px;border-radius:18px;background:white;border:1px solid #cfe0e5}.badge.on{background:var(--a);color:white}.rights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.right{padding:18px;border-radius:16px;background:white}.primary{background:var(--a)}@media(max-width:700px){.rights{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Regímenes</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Primero identificá tu credencial</div><h1>No todos trabajan bajo las mismas reglas</h1><p>Sector público, construcción, prácticas y hogar tienen beneficios y cálculos propios.</p></div></section><main class="work"><div class="shell"><div class="badges" id="badges"><button class="badge on" data-r="publico">Servidor público</button><button class="badge" data-r="obra">Construcción</button><button class="badge" data-r="practica">Practicante</button><button class="badge" data-r="hogar">Casa particular</button></div><div class="rights" id="rights"></div></div></main><footer class="site-footer"><div class="shell">Confirmá el régimen indicado en tu contrato.</div></footer><script>const data={publico:["30 días de vacaciones","Aguinaldos regulados","Compensación según régimen"],obra:["Jornal por categoría","Bonificación unificada","CTS y vacaciones propias"],practica:["Subvención mensual","Media subvención semestral","15 días de descanso"],hogar:["Gratificaciones","CTS","30 días de vacaciones"]};function draw(r){rights.innerHTML=data[r].map(x=>`<div class=right>✓ <b>${x}</b></div>`).join("")}badges.onclick=e=>{if(e.target.dataset.r){[...badges.children].forEach(x=>x.classList.toggle("on",x===e.target));draw(e.target.dataset.r)}};draw("publico")</script></body></html>
