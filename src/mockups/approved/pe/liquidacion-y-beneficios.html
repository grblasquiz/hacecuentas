<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidación Perú</title><link rel="stylesheet" href="latam-58-core.css"><style>:root{--a:#b04a3c}.hero{background:#fff1ed}.kicker{color:var(--a)}.envelope{background:#fff;border:2px solid #e4c6be;padding:28px;clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%)}.stub{display:flex;justify-content:space-between;border-bottom:1px dashed #c8b3ad;padding:12px}.primary{background:var(--a)}</style></head><body><header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Perú · Trabajo</nav></div></header><section class="hero"><div class="shell"><div class="kicker">Tu sobre de salida</div><h1>Me voy o me despiden: ¿qué entra en la liquidación?</h1><p>Beneficios truncos, vacaciones, CTS e indemnización aparecen como comprobantes separados.</p></div></section><main class="work"><div class="shell grid2"><aside class="card"><div class="field"><label>Motivo</label><select id="reason"><option value="0">Renuncia</option><option value="1">Despido sin causa</option><option value=".4">Fin de contrato</option></select></div><div class="field"><label>Sueldo mensual</label><input id="salary" type="number" value="3200"></div><div class="field"><label>Años trabajados</label><input id="years" type="number" value="3"></div><button id="calc" class="primary">Cerrar liquidación</button></aside><div class="envelope"><h2>Liquidación estimada</h2><div id="stubs"></div><div class="stub"><b>Total</b><strong id="total"></strong></div></div></div></main><footer class="site-footer"><div class="shell">No reemplaza la liquidación de RR.HH.</div></footer><script>const sol=n=>"S/ "+Math.round(n).toLocaleString("es-PE");function go(){let s=+salary.value,y=+years.value,r=+reason.value,vals=[["CTS trunca",s*.5],["Gratificación trunca",s*.5],["Vacaciones",s],["Indemnización",s*1.5*y*r]];stubs.innerHTML=vals.map(x=>`<div class=stub><span>${x[0]}</span><b>${sol(x[1])}</b></div>`).join("");total.textContent=sol(vals.reduce((a,x)=>a+x[1],0))}calc.onclick=go;[reason,salary,years].forEach(x=>x.oninput=go);go()</script></body></html>
