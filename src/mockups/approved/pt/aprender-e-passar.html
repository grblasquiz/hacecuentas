<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprender e passar</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f5f0fb}.study{padding:45px 0}.brief{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.week{margin-top:25px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:180px;padding:12px;border-radius:14px;background:#f3f6f5;border:1px solid var(--line)}.day strong{font-size:12px}.block{margin-top:8px;padding:9px;border-radius:8px;background:#7d68a1;color:#fff;font-size:12px}.block.review{background:#3b7f73}.grade{margin-top:20px;padding:20px;display:flex;align-items:center;gap:25px}.grade b{font-size:38px;color:#684f91}.ladder{flex:1;height:12px;border-radius:99px;background:linear-gradient(90deg,#d67454 0 60%,#4f9577 60%)}@media(max-width:800px){.brief{grid-template-columns:1fr 1fr}.week{overflow:auto}.day{min-width:120px}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Estudo</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Aprender e passar</div><h1 class=display>Transforme a nota que falta em sessões possíveis.</h1><p class=lead>Monte uma semana realista e saiba onde revisar antes da prova.</p></div></section><main class=study><div class=wrap><div class=brief><div><label>Nota atual</label><input id=current type=number value=6 step=.1></div><div><label>Nota para passar</label><input id=target type=number value=7 step=.1></div><div><label>Dias até a prova</label><input id=days type=number value=14></div><div><label>Minutos por dia</label><input id=min type=number value=45></div></div><button class=btn id=go style="margin-top:14px">Montar semana</button><div class=week id=week></div><div class="card grade"><div><small>ESFORÇO SUGERIDO</small><br><b id=hours></b></div><div class=ladder></div><span id=msg></span></div></div></main><footer class=foot>Plano orientativo: ajuste conforme dificuldade e peso da avaliação.</footer><script>(()=>{let $=s=>document.querySelector(s),names=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];function go(){let days=+$("#days").value,min=+$("#min").value,gap=Math.max(0,+$("#target").value-+$("#current").value),n=Math.min(7,days);$("#week").innerHTML=names.map((d,i)=>`<div class=day><strong>${d}</strong>${i<n?`<div class=block>${min} min · conteúdo</div>${i%3===2?`<div class="block review">15 min · revisão</div>`:""}`:`<div style="margin-top:18px;color:#75847f">descanso</div>`}</div>`).join("");$("#hours").textContent=(days*min/60).toFixed(1)+" h";$("#msg").textContent=gap?`Você precisa recuperar ${gap.toFixed(1)} ponto(s): priorize exercícios com erro.`:"Mantenha revisão curta para consolidar."}$("#go").onclick=go;go()})();</script></body></html>
