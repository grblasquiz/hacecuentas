<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Converter medidas</title><link rel="stylesheet" href="pt-mockup-core.css"><style>:root{--c:#397b88;--y:#dfa949}.hero{padding:40px 0;background:#eef7f7}.rulers{display:flex;gap:18px;margin-top:30px}.rulers i{height:42px;flex:1;background:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 24px);border:3px solid var(--c)}.lab{padding:55px 0}.board{padding:28px}.cats{display:flex;gap:8px;flex-wrap:wrap}.cats button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:99px}.cats .on{background:var(--c);color:#fff}.equation{display:grid;grid-template-columns:1fr 70px 1fr;gap:15px;align-items:center;margin:28px 0}.side{background:#f2f6f5;padding:20px;border-radius:14px}.side input{border:0;background:none;font-size:45px;font-weight:950}.swap{border:0;border-radius:50%;width:55px;height:55px;background:var(--y);font-size:25px}.formula{text-align:center;background:#edf5f5;padding:15px;border-radius:12px}@media(max-width:800px){.equation{grid-template-columns:1fr}.swap{margin:auto}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Matemática · Conversores</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap"><div class="crumb">Matemática / Converter medidas</div><h1 class="display">Converta sem perder a relação entre as unidades.</h1><p class="lead">Escolha a grandeza, inverta o sentido e veja o fator aplicado.</p><div class="rulers"><i></i><i></i></div></div></section><section class="lab"><div class="wrap card board"><div class="cats"><button class="on" data-c="length">Comprimento</button><button data-c="mass">Peso</button><button data-c="volume">Volume</button></div><div class="equation"><div class="side"><input id="from" value="1"><select id="fu"></select></div><button class="swap" id="swap">⇄</button><div class="side"><input id="to" readonly><select id="tu"></select></div></div><div class="formula" id="formula"></div></div></section><footer class="foot">No site final, cabeçalho e rodapé originais.</footer><script>(()=>{const $=s=>document.querySelector(s),d={length:{m:1,cm:.01,km:1000,ft:.3048},mass:{kg:1,g:.001,lb:.453592},volume:{L:1,mL:.001,"m³":1000,gal:3.78541}};let c="length";function opts(){let k=Object.keys(d[c]);$("#fu").innerHTML=k.map(x=>`<option>${x}</option>`).join("");$("#tu").innerHTML=k.map((x,i)=>`<option ${i===1?"selected":""}>${x}</option>`).join("");draw()}function draw(){let a=+$("#from").value,u=$("#fu").value,v=$("#tu").value,r=a*d[c][u]/d[c][v];$("#to").value=+r.toFixed(6);$("#formula").textContent=`${a} ${u} × ${d[c][u]/d[c][v]} = ${+r.toFixed(6)} ${v}`}document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-c]").forEach(x=>x.classList.remove("on"));b.classList.add("on");c=b.dataset.c;opts()});$("#swap").onclick=()=>{let x=$("#fu").value;$("#fu").value=$("#tu").value;$("#tu").value=x;draw()};["from","fu","tu"].forEach(x=>$("#"+x).oninput=draw);opts()})();</script></body></html>
