<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treino e desempenho</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#edf6ef}.training{padding:45px 0}.top{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:25px}.day{min-height:210px;border:1px solid var(--line);border-radius:14px;padding:10px}.load{margin-top:8px;border-radius:8px;padding:10px;background:#3d8068;color:#fff}.hard{background:#c86643}.rest{background:#e8edeb;color:#596863}.balance{margin-top:18px;padding:22px;display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center}.dial{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d77d45 var(--load),#e5ece9 0);border:12px solid #fff;box-shadow:0 0 0 1px #dbe5e3}.dial b{font-size:25px}@media(max-width:800px){.top{grid-template-columns:1fr 1fr}.week{overflow:auto}.day{min-width:120px}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Treino</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Treino e desempenho</div><h1 class=display>Treine forte sem apagar a recuperação.</h1><p class=lead>Distribua volume, intensidade e descanso em uma semana que seu corpo aguenta.</p></div></section><main class=training><div class=wrap><div class=top><div><label>Objetivo</label><select id=goal><option>Corrida 10 km</option><option>Força</option><option>Condicionamento</option></select></div><div><label>Dias disponíveis</label><input id=days type=number min=2 max=7 value=4></div><div><label>Minutos por sessão</label><input id=min type=number value=50></div><button class=btn id=go>Organizar semana</button></div><div class=week id=week></div><div class="card balance"><div class=dial id=dial><b id=score></b></div><div><h3 id=status></h3><p id=advice></p></div></div></div></main><footer class=foot>Aumente carga gradualmente e interrompa o treino diante de sintomas incomuns.</footer><script>(()=>{let $=s=>document.querySelector(s),names=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];function go(){let d=Math.min(7,+$("#days").value),min=+$("#min").value,slots=[0,2,4,6,1,3,5].slice(0,d),load=d*min;$("#week").innerHTML=names.map((n,i)=>{let j=slots.indexOf(i),hard=j>=0&&j%3===1;return `<div class=day><b>${n}</b><div class="load ${j<0?"rest":hard?"hard":""}">${j<0?"Recuperação":hard?`${min} min · intenso`:`${min} min · base`}</div>${j>=0?`<small>Mobilidade: 10 min</small>`:""}</div>`}).join("");let p=Math.min(95,load/4);$("#dial").style.cssText=`--load:${p}%`;$("#score").textContent=Math.round(p)+"%";$("#status").textContent=p>80?"Semana exigente":"Carga bem distribuída";$("#advice").textContent=p>80?"Reserve sono e reduza uma sessão intensa se houver fadiga.":"Alterne estímulos e mantenha ao menos um dia leve entre intensos."}$("#go").onclick=go;go()})();</script></body></html>
