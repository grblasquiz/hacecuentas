<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bebê e família</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#fff4e9}.nursery{padding:45px 0}.months{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.months button{min-width:54px;height:54px;border-radius:50%;border:1px solid #e5d4c7;background:#fff;font-weight:900}.months .on{background:#c86448;color:#fff}.routine{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:23px}.clock{padding:25px}.timeline{display:grid;grid-template-columns:75px 1fr;gap:8px}.time{font-weight:900;color:#b15840}.task{padding:10px;border-radius:9px;background:#f7eee9}.basket{padding:25px;background:#f1f6f2}.basket strong{font-size:35px;color:#34735e}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini div{padding:12px;background:#fff;border-radius:10px}@media(max-width:800px){.routine{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Bebê</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Bebê e família</div><h1 class=display>Um dia possível para a fase do seu bebê.</h1><p class=lead>Leite, fraldas, sono e orçamento mudam mês a mês. Veja tudo no mesmo ritmo.</p></div></section><main class=nursery><div class=wrap><div class=months id=months></div><div class=routine><section class="card clock"><h2 id=title></h2><div class=timeline id=line></div></section><aside class="card basket"><small>CESTA MENSAL ESTIMADA</small><br><strong id=cost></strong><p id=note></p><div class=mini id=mini></div></aside></div></div></main><footer class=foot>Rotinas variam; alimentação e desenvolvimento devem ser acompanhados pelo pediatra.</footer><script>(()=>{let $=s=>document.querySelector(s),m=5;$("#months").innerHTML=Array.from({length:12},(_,i)=>`<button data-m=${i} class="${i===m?"on":""}">${i+1}m</button>`).join("");function go(){document.querySelector(".months .on")?.classList.remove("on");document.querySelector(`[data-m="${m}"]`).classList.add("on");let feeds=Math.max(4,8-Math.floor(m/3)),sleep=Math.max(12,16-m*.25),diapers=Math.max(5,9-Math.floor(m/3)),cost=380+diapers*18+(m>5?160:0);$("#title").textContent=`Rotina-base · ${m+1}º mês`;$("#line").innerHTML=[["07:00","Acordar, alimentar e trocar"],["10:00","Soneca e interação"],["13:00",m>4?"Alimentação e colo":"Leite e colo"],["16:00","Passeio curto"],["19:30","Banho e ritual de sono"]].map(x=>`<b class=time>${x[0]}</b><div class=task>${x[1]}</div>`).join("");$("#cost").textContent="R$ "+cost;$("#note").textContent="Ajuste marcas e itens reaproveitados.";$("#mini").innerHTML=`<div><b>${feeds}×</b><br>mamadas/refeições</div><div><b>${diapers}×</b><br>fraldas por dia</div><div><b>${sleep}h</b><br>sono total</div><div><b>${30-m}</b><br>dias para revisar</div>`}document.querySelectorAll(".months button").forEach(b=>b.onclick=()=>{m=+b.dataset.m;go()});go()})();</script></body></html>
