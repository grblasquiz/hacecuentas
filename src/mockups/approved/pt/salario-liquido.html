<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salário líquido</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#eef6f6}.pay{padding:45px 0}.waterfall{display:grid;grid-template-columns:270px 1fr;gap:24px}.controls{padding:23px}.receipt{padding:28px;background:#fffdf7;font-family:ui-monospace,monospace}.receipt h2{text-align:center;letter-spacing:.2em}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px dotted #9eaaa5}.row.minus span:last-child{color:#b54d3c}.row.plus span:last-child{color:#247158}.net{display:flex;justify-content:space-between;align-items:end;margin-top:20px;border:2px solid #287183;padding:18px}.net strong{font:950 38px/1 system-ui;color:#287183}.toggles button{border:1px solid var(--line);background:#fff;padding:8px;border-radius:8px;margin:4px}.toggles .on{background:#dff0ea}@media(max-width:800px){.waterfall{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Trabalho · Holerite</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Trabalho / Salário líquido</div><h1 class=display>Do bruto ao que cai na conta.</h1><p class=lead>Um holerite legível para entender cada adicional e desconto.</p></div></section><main class=pay><div class="wrap waterfall"><aside class="card controls"><label>Salário bruto</label><input id=s type=number value=6500><label>Dependentes</label><input id=d type=number value=1><label>Adicionais</label><div class=toggles><button data-v=.2>Noturno</button><button data-v=.3>Periculosidade</button></div><label>Outros descontos</label><input id=o type=number value=250><button class=btn id=go style="width:100%;margin-top:18px">Atualizar holerite</button></aside><section class="card receipt"><h2>DEMONSTRATIVO</h2><div id=rows></div><div class=net><span>Líquido estimado</span><strong id=net></strong></div></section></div></main><footer class=foot>Cálculo ilustrativo; a folha oficial aplica tabelas e bases vigentes.</footer><script>(()=>{let $=s=>document.querySelector(s),add=0;document.querySelectorAll(".toggles button").forEach(b=>b.onclick=()=>{b.classList.toggle("on");add=[...document.querySelectorAll(".toggles .on")].reduce((a,x)=>a+ +x.dataset.v,0);go()});function go(){let s=+$("#s").value,br=s*(1+add),inss=Math.min(br*.11,951),ir=Math.max(0,(br-inss-+$("#d").value*190)*.15-370),other=+$("#o").value,net=br-inss-ir-other,rs=v=>"R$ "+v.toLocaleString("pt-BR",{maximumFractionDigits:2});$("#rows").innerHTML=`<div class="row plus"><span>Salário base</span><span>${rs(s)}</span></div>${add?`<div class="row plus"><span>Adicionais</span><span>+ ${rs(br-s)}</span></div>`:""}<div class="row minus"><span>INSS estimado</span><span>− ${rs(inss)}</span></div><div class="row minus"><span>IRRF estimado</span><span>− ${rs(ir)}</span></div><div class="row minus"><span>Outros descontos</span><span>− ${rs(other)}</span></div>`;$("#net").textContent=rs(net)}$("#go").onclick=go;go()})();</script></body></html>
