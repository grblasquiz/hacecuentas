<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decisões do dia a dia</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f0f6f4}.inbox{padding:45px 0}.situations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.situations button{min-height:95px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;padding:16px;font-weight:900}.situations .on{background:#2d7175;color:#fff}.compare{display:grid;grid-template-columns:1fr 90px 1fr;gap:15px;align-items:center;margin-top:24px}.choice{padding:24px}.choice input{font-size:24px}.versus{text-align:center;font-weight:950}.winner{margin-top:16px;border-radius:13px;padding:14px;background:#e3f2eb;color:#24664e;font-weight:900}.why{padding:20px;margin-top:18px;border-left:7px solid #d87f47;background:#fff5ed}@media(max-width:800px){.situations{grid-template-columns:1fr 1fr}.compare{grid-template-columns:1fr}.versus{display:none}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Decisões</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Decisões do dia a dia</div><h1 class=display>Coloque duas opções na mesma régua.</h1><p class=lead>Escolha a dúvida; nós mostramos custo total, tempo e ponto de equilíbrio.</p></div></section><main class=inbox><div class=wrap><div class=situations><button data-m=0 class=on>Comprar ou assinar</button><button data-m=1>Consertar ou trocar</button><button data-m=2>Fazer ou contratar</button><button data-m=3>À vista ou parcelado</button></div><div class=compare><section class="card choice"><h2 id=la>Comprar</h2><label>Custo inicial</label><input id=a type=number value=1800><label>Custo mensal</label><input id=am type=number value=40></section><div class=versus>OU</div><section class="card choice"><h2 id=lb>Assinar</h2><label>Custo inicial</label><input id=b type=number value=0><label>Custo mensal</label><input id=bm type=number value=120></section></div><div class=winner id=win></div><div class=why id=why></div></div></main><footer class=foot>Compare também qualidade, risco e flexibilidade — nem tudo cabe no preço.</footer><script>(()=>{let $=s=>document.querySelector(s),m=0,names=[["Comprar","Assinar"],["Consertar","Trocar"],["Fazer","Contratar"],["À vista","Parcelado"]];document.querySelectorAll(".situations button").forEach(x=>x.onclick=()=>{document.querySelector(".situations .on").classList.remove("on");x.classList.add("on");m=+x.dataset.m;[$("#la").textContent,$("#lb").textContent]=names[m];go()});function go(){let months=12,ta=+$("#a").value+ +$("#am").value*months,tb=+$("#b").value+ +$("#bm").value*months,w=ta<=tb?names[m][0]:names[m][1],diff=Math.abs(ta-tb);$("#win").textContent=`Em 12 meses, ${w} custa R$ ${diff.toLocaleString("pt-BR")} menos.`;let delta=+$("#bm").value-+$("#am").value,be=delta>0?(+$("#a").value-+$("#b").value)/delta:0;$("#why").innerHTML=`<b>Ponto de equilíbrio</b><br>${be>0?`A vantagem muda perto do mês ${Math.ceil(be)}.`:"Neste cenário, a diferença mensal não cria uma virada."}` }document.querySelectorAll("input").forEach(x=>x.oninput=go);go()})();</script></body></html>
