<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometria e trigonometria</title><link rel="stylesheet" href="pt-mockup-core.css"><style>:root{--g:#3d7c88;--a:#dd9851}.hero{padding:42px 0;background:#edf6f7}.canvas{height:300px;position:relative}.tri{position:absolute;left:15%;bottom:20px;width:0;height:0;border-left:170px solid transparent;border-bottom:230px solid var(--g)}.angle{position:absolute;left:14%;bottom:12px;width:90px;height:90px;border:7px solid var(--a);border-radius:50%}.solve{padding:50px 0}.panel{padding:25px;display:grid;grid-template-columns:330px 1fr;gap:28px}.shapes{display:flex;gap:8px}.shapes button{flex:1;border:1px solid var(--line);background:#fff;padding:11px;border-radius:10px}.shapes .on{background:var(--g);color:#fff}.answer{font-size:58px;font-weight:950;color:var(--g)}.proof{padding:16px;background:#eff5f6;border-radius:13px;font-family:Georgia,serif;font-size:21px}@media(max-width:800px){.panel{grid-template-columns:1fr}.canvas{height:220px;transform:scale(.8)}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Matemática · Geometria</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center"><div><div class="crumb">Matemática / Geometria</div><h1 class="display">Desenhe o que você sabe. Calcule o que falta.</h1><p class="lead">O diagrama mostra quais medidas entram e qual relação resolve a figura.</p></div><div class="canvas"><i class="tri"></i><i class="angle"></i></div></div></section><section class="solve"><div class="wrap card panel"><div><div class="shapes"><button class="on" data-s="tri">Triângulo</button><button data-s="right">Retângulo</button><button data-s="cone">Cone</button></div><label>Lado a<input id="a" type="number" value="3"></label><label>Lado b<input id="b" type="number" value="4"></label><label>Lado c<input id="c" type="number" value="5"></label></div><div><small id="label">Área pelo método de Heron</small><div class="answer" id="answer"></div><div class="proof" id="proof"></div></div></div></section><footer class="foot">No site final, cabeçalho e rodapé originais.</footer><script>(()=>{let s="tri";const $=x=>document.querySelector(x);function draw(){let a=+$("#a").value,b=+$("#b").value,c=+$("#c").value;if(s==="tri"){let p=(a+b+c)/2,A=Math.sqrt(Math.max(0,p*(p-a)*(p-b)*(p-c)));$("#label").textContent="Área pelo método de Heron";$("#answer").textContent=A.toFixed(2);$("#proof").textContent=`s = (${a} + ${b} + ${c}) ÷ 2 = ${p}; área = √s(s-a)(s-b)(s-c)`}else if(s==="right"){$("#label").textContent="Hipotenusa";$("#answer").textContent=Math.hypot(a,b).toFixed(2);$("#proof").textContent=`c = √(${a}² + ${b}²)`}else{$("#label").textContent="Volume do cone";$("#answer").textContent=(Math.PI*a*a*b/3).toFixed(2);$("#proof").textContent=`V = π × raio² × altura ÷ 3`}}document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));b.classList.add("on");s=b.dataset.s;draw()});document.querySelectorAll("input").forEach(x=>x.oninput=draw);draw()})();</script></body></html>
