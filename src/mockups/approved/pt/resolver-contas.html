<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resolver contas</title><link rel="stylesheet" href="pt-mockup-core.css"><style>:root{--chalk:#376878;--paper:#fff8df}.hero{padding:42px 0;background:#edf4f5}.board{background:#315d68;color:#fff;padding:32px;transform:rotate(1deg);box-shadow:12px 14px 0 #d4dedf;font-family:Georgia,serif;font-size:30px}.work{padding:50px 0}.sheet{padding:26px;background:var(--paper)}.problem{display:grid;grid-template-columns:1fr 150px;gap:12px}.problem input{font-size:23px}.steps{counter-reset:n;margin-top:20px}.step{counter-increment:n;display:grid;grid-template-columns:50px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid #dfd6b8}.step:before{content:counter(n);width:38px;height:38px;border-radius:50%;background:var(--chalk);color:#fff;display:grid;place-items:center;font-weight:900}.answer{font-size:40px;color:var(--chalk);font-weight:950}@media(max-width:800px){.problem{grid-template-columns:1fr}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Matemática · Resolver</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center"><div><div class="crumb">Matemática / Resolver contas</div><h1 class="display">Não dê só a resposta. Mostre o caminho.</h1><p class="lead">Resolva expressões com prioridade de operações e confira cada transformação.</p></div><div class="board">( 12 + 8 ) ÷ 4<br>× 3 = ?</div></div></section><section class="work"><div class="wrap card sheet"><div class="problem"><input id="expr" value="(12 + 8) / 4 * 3"><button class="btn" id="solve">Resolver passo a passo</button></div><div class="steps" id="steps"></div><div class="answer" id="answer"></div></div></section><footer class="foot">No site final, cabeçalho e rodapé originais.</footer><script>(()=>{const $=s=>document.querySelector(s);function solve(){let x=$("#expr").value;if(!/^[0-9+*/().\s-]+$/.test(x)){($("#answer").textContent="Use apenas números e operações.");return}let v;try{v=Function(`"use strict";return (${x})`)()}catch{v="erro"};$("#steps").innerHTML=`<div class="step"><b>Resolva primeiro os parênteses.</b></div><div class="step"><b>Faça multiplicações e divisões da esquerda para a direita.</b></div><div class="step"><b>Finalize somas e subtrações.</b></div>`;$("#answer").textContent="Resultado: "+v}$("#solve").onclick=solve;$("#expr").onkeydown=e=>{if(e.key==="Enter")solve()};solve()})();</script></body></html>
