<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescisão CLT</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f9f1ea}.exit{padding:44px 0}.reasons{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.reasons button{border:1px solid #d5dfdc;border-radius:10px;background:#fff;padding:11px}.reasons .on{background:#a85436;color:#fff}.envelope{border:2px solid #dfc7b7;border-radius:18px;background:#fffaf6;padding:26px;position:relative}.envelope:after{content:"";position:absolute;left:0;right:0;top:0;border-left:50vw solid transparent;border-right:50vw solid transparent;border-top:130px solid #f1dfd1;opacity:.35;pointer-events:none}.rights{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.right{padding:15px;background:#fff;border:1px solid #eadad0;border-radius:11px}.right.off{text-decoration:line-through;opacity:.4}.amount{position:relative;margin-top:20px;padding-top:20px;border-top:2px dashed #d5bcae;font-size:36px;font-weight:950;color:#954b32}@media(max-width:800px){.rights{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Trabalho · Rescisão</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Trabalho / Rescisão CLT</div><h1 class=display>Abra o envelope da sua saída.</h1><p class=lead>O motivo muda o que entra na conta. Selecione-o primeiro e confira direito por direito.</p></div></section><main class=exit><div class=wrap><label>Como terminou o contrato?</label><div class=reasons id=reasons><button data-r=0 class=on>Demissão sem justa causa</button><button data-r=1>Pedido de demissão</button><button data-r=2>Acordo</button><button data-r=3>Justa causa</button><button data-r=4>Prazo determinado</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px"><div><label>Salário</label><input id=s type=number value=4800></div><div><label>Meses desde as últimas férias</label><input id=m type=number value=8></div></div><section class=envelope><div class=rights id=rights></div><div class=amount id=amount></div></section></div></main><footer class=foot>Estimativa inicial; datas, aviso e médias alteram o valor final.</footer><script>(()=>{let r=0,$=s=>document.querySelector(s);document.querySelectorAll("#reasons button").forEach(b=>b.onclick=()=>{document.querySelector(".reasons .on").classList.remove("on");b.classList.add("on");r=+b.dataset.r;go()});function go(){let s=+$("#s").value,m=+$("#m").value,items=[["Saldo de salário",1],["13º proporcional",r!==3],["Férias + 1/3",r!==3],["Aviso-prévio",r===0||r===2],["Saque do FGTS",r===0||r===2],["Multa de 40% do FGTS",r===0]],base=s*.5+s*m/12+s*m/9,total=base+(items[3][1]?s*(r===2?.5:1):0)+(items[5][1]?s*.8:0);$("#rights").innerHTML=items.map(x=>`<div class="right ${x[1]?"":"off"}">${x[1]?"✓":"—"} <b>${x[0]}</b></div>`).join("");$("#amount").textContent="Faixa inicial: R$ "+total.toLocaleString("pt-BR",{maximumFractionDigits:0})}document.querySelectorAll("input").forEach(x=>x.oninput=go);go()})();</script></body></html>
