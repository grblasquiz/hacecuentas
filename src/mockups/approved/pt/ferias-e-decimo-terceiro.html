<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Férias e décimo terceiro</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:44px 0;background:#fff4ec}.planner{padding:45px 0}.top{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}.calendar{margin-top:25px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px}.month{min-height:118px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:#fff}.month b{display:block;font-size:11px}.month.pay{background:#e7f4ee;border-color:#7aaf98}.month.vac{background:#fff0df;border-color:#e2a572}.money{font-size:12px;font-weight:900;margin-top:30px}.summary{margin-top:18px;padding:21px;display:flex;justify-content:space-between;gap:20px}.summary strong{font-size:28px;color:#a75624}@media(max-width:800px){.top{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(3,1fr)}.summary{display:block}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Trabalho · Calendário</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Trabalho / Férias e 13º</div><h1 class=display>Veja em quais meses seu dinheiro muda.</h1><p class=lead>Planeje férias, abono e décimo terceiro no calendário anual.</p></div></section><main class=planner><div class=wrap><div class=top><div><label>Salário bruto</label><input id=s type=number value=4200></div><div><label>Mês das férias</label><select id=v></select></div><div><label>Formato</label><select id=mode><option value=30>30 dias</option><option value=20>20 dias + vender 10</option><option value=15>Dividir em 15 + 15</option></select></div><button id=go class=btn>Montar meu ano</button></div><div class=calendar id=cal></div><section class="card summary" id=sum></section></div></main><footer class=foot>Valores brutos estimados; descontos aparecem na folha real.</footer><script>(()=>{let $=s=>document.querySelector(s),names=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];$("#v").innerHTML=names.map((n,i)=>`<option value=${i}>${n}</option>`).join("");$("#v").value=6;function go(){let s=+$("#s").value,m=+$("#v").value,mode=+$("#mode").value;$("#cal").innerHTML=names.map((n,i)=>{let vac=i===m,pay=i===10||i===11,extra=(vac?s/3+(mode===20?s/3:0):0)+(pay?s/2:0);return `<div class="month ${vac?"vac":pay?"pay":""}"><b>${n}</b>${vac?"🏖 Férias":pay?"13º salário":""}<div class=money>${extra?`+ R$ ${extra.toLocaleString("pt-BR",{maximumFractionDigits:0})}`:"mês normal"}</div></div>`}).join("");let f=s/3+(mode===20?s/3:0);$("#sum").innerHTML=`<div><b>Adicionais previstos no ano</b><p>Férias + 1/3 e duas parcelas do 13º.</p></div><strong>R$ ${(f+s).toLocaleString("pt-BR",{maximumFractionDigits:0})}</strong>`}$("#go").onclick=go;go()})();</script></body></html>
