<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quanto custa contratar</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#edf6f2}.desk{padding:48px 0}.layout{display:grid;grid-template-columns:340px 1fr;gap:25px}.inputs{padding:24px}.stack{display:flex;min-height:330px;align-items:flex-end;gap:8px;padding:27px}.bar{flex:1;border-radius:11px 11px 3px 3px;min-width:80px;color:#fff;padding:12px;font-weight:850;transition:.2s}.salary{background:#32738a}.charges{background:#d47843}.provisions{background:#4d8a6c}.benefits{background:#8969a1}.total{padding:20px;background:#223f47;color:#fff;border-radius:16px;margin-top:18px}.total strong{font-size:36px}.switches{display:flex;gap:8px;margin-top:10px}.switches button{flex:1;border:1px solid var(--line);background:#fff;padding:9px;border-radius:8px}.switches .on{background:#dfeee8;border-color:#438a69}@media(max-width:800px){.layout{grid-template-columns:1fr}.stack{overflow:auto}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Trabalho · Empregador</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Trabalho / Quanto custa contratar</div><h1 class=display>O salário é só a primeira camada.</h1><p class=lead>Empilhe encargos, provisões e benefícios para enxergar o custo mensal real.</p></div></section><main class=desk><div class="wrap layout"><aside class="card inputs"><label>Salário bruto</label><input id=s type=number value=3500><label>Regime da empresa</label><select id=r><option value=.68>Lucro real/presumido</option><option value=.45>Simples Nacional</option><option value=.31>Empregador doméstico</option><option value=.15>Contratação PJ</option></select><label>Benefícios mensais</label><input id=b type=number value=650><div class=switches><button class=on id=vt>Vale-transporte</button><button id=vr>Vale-refeição</button></div><button class=btn id=go style="width:100%;margin-top:17px">Refazer pilha</button></aside><section><div class="card stack" id=stack></div><div class=total id=total></div></section></div></main><footer class=foot>Estimativa gerencial; alíquotas variam por regime, RAT e terceiros.</footer><script>(()=>{let $=s=>document.querySelector(s),extra=0;["vt","vr"].forEach(id=>$("#"+id).onclick=()=>{$("#"+id).classList.toggle("on");extra=document.querySelectorAll(".switches .on").length*120;go()});function go(){let s=+$("#s").value,rate=+$("#r").value,b=+$("#b").value+extra,enc=s*rate*.48,prov=s*rate*.52,t=s+enc+prov+b,vals=[["Salário",s,"salary"],["Encargos",enc,"charges"],["Provisões",prov,"provisions"],["Benefícios",b,"benefits"]];$("#stack").innerHTML=vals.map(x=>`<div class="bar ${x[2]}" style="height:${80+x[1]/t*220}px">${x[0]}<br>R$ ${x[1].toFixed(0)}</div>`).join("");$("#total").innerHTML=`Custo estimado por mês<br><strong>R$ ${t.toLocaleString("pt-BR",{maximumFractionDigits:0})}</strong><br><small>${(t/s).toFixed(2)}× o salário bruto</small>`}$("#go").onclick=go;go()})();</script></body></html>
