<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benefícios do governo</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#fff6df}.triage{padding:45px 0}.question{padding:28px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{border:1px solid #c9d7d4;background:#fff;padding:10px 13px;border-radius:99px;font-weight:800}.choices button.on{background:#287166;color:#fff;border-color:#287166}.match{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:25px}.program{padding:21px;position:relative}.program .score{font-size:32px;font-weight:950;color:#287166}.program.no{opacity:.55}.program h3{margin:5px 0}.next{border-top:1px solid var(--line);padding-top:12px;color:#53676d}@media(max-width:800px){.match{grid-template-columns:1fr}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Trabalho · Benefícios</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap"><div class="crumb">Trabalho / Benefícios do governo</div><h1 class="display">Descubra onde vale a pena bater à porta.</h1><p class="lead">Uma triagem clara para sua família, sem prometer aprovação.</p></div></section><main class="triage"><div class="wrap"><section class="card question"><b>1. Conte o essencial da sua casa</b><label>Renda familiar por mês</label><input id="income" type="number" value="1800"><label>Pessoas na casa</label><input id="people" type="number" value="4"><label>Situações presentes</label><div class=choices><button data-k="child" class=on>Criança ou adolescente</button><button data-k="worker">Trabalhou com carteira</button><button data-k="elder">Pessoa idosa</button><button data-k="disabled">Pessoa com deficiência</button></div><button class=btn id=check style="margin-top:20px">Ver possibilidades</button></section><div class=match id=match></div></div></main><footer class=foot>Elegibilidade final depende do CadÚnico e dos órgãos responsáveis.</footer><script>(()=>{let state={child:1},$=s=>document.querySelector(s);document.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>{b.classList.toggle("on");state[b.dataset.k]=b.classList.contains("on")});function go(){let pc=+$("#income").value/+$("#people").value,items=[["Bolsa Família",pc<=706&&state.child,"Atualize o CadÚnico e confira as condicionalidades."],["Abono PIS/PASEP",state.worker,"Consulte ano-base e tempo de cadastro na Carteira Digital."],["BPC/LOAS",pc<=500&&(state.elder||state.disabled),"Verifique renda, idade ou avaliação da deficiência no INSS."]];$("#match").innerHTML=items.map(x=>`<article class="card program ${x[1]?"":"no"}"><span class=score>${x[1]?"Boa pista":"Pouco provável"}</span><h3>${x[0]}</h3><p>${x[1]?"Seu perfil merece uma consulta oficial.":"Os dados informados não apontam prioridade agora."}</p><div class=next>${x[2]}</div></article>`).join("")}$("#check").onclick=go;go()})();</script></body></html>
