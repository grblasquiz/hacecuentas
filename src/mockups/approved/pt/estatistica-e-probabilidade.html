<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estatística e probabilidade</title><link rel="stylesheet" href="pt-mockup-core.css"><style>:root{--p:#6e6592;--dot:#d79a4b}.hero{padding:42px 0;background:#f3f1f7}.dots{height:210px;display:flex;align-items:center;justify-content:center;gap:12px}.dots i{width:var(--s);height:var(--s);border-radius:50%;background:var(--c)}.lab{padding:50px 0}.grid{display:grid;grid-template-columns:330px 1fr;gap:22px}.form,.result{padding:24px}.modes button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px}.modes .on{background:#f0eef6;color:var(--p);font-weight:900}.hist{height:180px;display:flex;align-items:end;gap:7px}.hist i{flex:1;height:var(--h);background:var(--p);border-radius:6px 6px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats div{padding:14px;background:#f4f3f7;border-radius:12px}.stats strong{display:block;font-size:23px}textarea{font:inherit;border:1px solid #cbd8d6;border-radius:10px;padding:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Matemática · Estatística</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap"><div class="crumb">Matemática / Estatística e probabilidade</div><h1 class="display">Veja a distribuição antes de resumir tudo em um número.</h1><p class="lead">Cole dados, observe forma e dispersão e só então leia média, mediana e chance.</p><div class="dots"><i style="--s:30px;--c:#6e6592"></i><i style="--s:70px;--c:#d79a4b"></i><i style="--s:42px;--c:#6e6592"></i><i style="--s:95px;--c:#8c82ad"></i></div></div></section><section class="lab"><div class="wrap grid"><aside class="card form"><div class="modes"><button data-mode="data" class="on">Descrever meus dados</button><button data-mode="binomial">Probabilidade binomial</button><button data-mode="comb">Combinações</button></div><label id="prompt">Dados separados por vírgula<textarea id="data" style="width:100%;height:110px">12, 14, 15, 15, 18, 22, 31</textarea></label></aside><div class="card result"><div class="hist" id="hist"></div><div class="stats"><div><small id="l1">Média</small><strong id="mean"></strong></div><div><small id="l2">Mediana</small><strong id="median"></strong></div><div><small id="l3">Desvio</small><strong id="sd"></strong></div></div></div></div></section><footer class="foot">No site final, cabeçalho e rodapé originais.</footer><script>(()=>{const $=s=>document.querySelector(s);let mode="data",defaults={data:"12, 14, 15, 15, 18, 22, 31",binomial:"10, 0.40, 4",comb:"12, 3"};function fact(n){let v=1;for(let i=2;i<=n;i++)v*=i;return v}function draw(){let a=$("#data").value.split(/[,;\\s]+/).map(Number).filter(Number.isFinite);if(!a.length)return;if(mode==="data"){a.sort((x,y)=>x-y);let m=a.reduce((s,x)=>s+x,0)/a.length,med=a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2,sd=Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length),max=Math.max(...a);$("#mean").textContent=m.toFixed(2);$("#median").textContent=med;$("#sd").textContent=sd.toFixed(2);$("#hist").innerHTML=a.map(x=>`<i style="--h:${20+x/max*150}px"></i>`).join("");return}if(mode==="binomial"){let [n,p,k]=a,c=fact(n)/(fact(k)*fact(n-k)),chance=c*p**k*(1-p)**(n-k);$("#mean").textContent=(n*p).toFixed(2);$("#median").textContent=(chance*100).toFixed(2)+"%";$("#sd").textContent=Math.sqrt(n*p*(1-p)).toFixed(2);$("#hist").innerHTML=Array.from({length:n+1},(_,x)=>{let q=fact(n)/(fact(x)*fact(n-x))*p**x*(1-p)**(n-x);return `<i style="--h:${Math.max(4,q*520)}px"></i>`}).join("");return}let [n,k]=a,c=fact(n)/(fact(k)*fact(n-k));$("#mean").textContent=c.toLocaleString("pt-BR");$("#median").textContent=n;$("#sd").textContent=k;$("#hist").innerHTML=Array.from({length:k},(_,i)=>`<i style="--h:${55+i*35}px"></i>`).join("")}document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{document.querySelector(".modes .on").classList.remove("on");b.classList.add("on");mode=b.dataset.mode;$("#data").value=defaults[mode];$("#prompt").firstChild.textContent=mode==="data"?"Dados separados por vírgula":mode==="binomial"?"Tentativas, chance (0–1), sucessos":"Total de itens, itens escolhidos";[$("#l1").textContent,$("#l2").textContent,$("#l3").textContent]=mode==="data"?["Média","Mediana","Desvio"]:mode==="binomial"?["Sucessos esperados","Chance exata","Desvio"]:["Combinações","Total","Escolhidos"];draw()});$("#data").oninput=draw;draw()})();</script></body></html>
