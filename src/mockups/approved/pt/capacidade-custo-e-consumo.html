<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capacidade, custo e consumo</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#eef7f4}.lab{padding:45px 0}.modes{display:flex;gap:8px}.modes button{border:0;background:#e6ecea;padding:11px 15px;border-radius:10px;font-weight:850}.modes .on{background:#286e72;color:#fff}.bench{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}.controls,.gaugebox{padding:25px}.gauge{height:35px;background:#dde7e4;border-radius:99px;overflow:hidden}.fill{height:100%;width:50%;background:linear-gradient(90deg,#42a27c,#e1a24f,#c75b4c);transition:.2s}.big{font-size:44px;font-weight:950;color:#286e72}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.tiles div{padding:12px;background:#f4f7f6;border-radius:10px}@media(max-width:800px){.bench{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Capacidade</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Capacidade, custo e consumo</div><h1 class=display>Vai caber, durar ou custar quanto?</h1><p class=lead>Troque o contexto; a ferramenta adapta unidades e resposta.</p></div></section><main class=lab><div class=wrap><div class=modes><button data-mode=0 class=on>Armazenamento</button><button data-mode=1>Bateria</button><button data-mode=2>Internet</button></div><div class=bench><section class="card controls"><label id=l1>Capacidade total (GB)</label><input id=a type=number value=256><label id=l2>Uso médio (GB)</label><input id=b type=number value=180><label>Custo mensal (R$)</label><input id=c type=number value=49><button class=btn id=go style="margin-top:18px">Medir agora</button></section><section class="card gaugebox"><small id=caption>OCUPAÇÃO</small><div class=big id=result></div><div class=gauge><div class=fill id=fill></div></div><div class=tiles id=tiles></div></section></div></div></main><footer class=foot>Estimativa prática para comparar capacidade e consumo.</footer><script>(()=>{let mode=0,$=s=>document.querySelector(s),cfg=[["Capacidade total (GB)","Uso atual (GB)","OCUPAÇÃO"],["Capacidade (mAh)","Consumo por hora (mAh)","AUTONOMIA"],["Velocidade contratada (Mbps)","Dispositivos conectados","CARGA DA REDE"]];document.querySelectorAll(".modes button").forEach(x=>x.onclick=()=>{document.querySelector(".modes .on").classList.remove("on");x.classList.add("on");mode=+x.dataset.mode;[$("#l1").textContent,$("#l2").textContent,$("#caption").textContent]=cfg[mode];go()});function go(){let a=+$("#a").value,b=Math.max(1,+$("#b").value),c=+$("#c").value,p=mode===0?b/a*100:mode===1?100/Math.max(1,a/b):b*12/a*100,val=mode===0?`${Math.max(0,a-b)} GB livres`:mode===1?`${(a/b).toFixed(1)} horas`:`${Math.max(1,Math.floor(a/(b*8)))} streams HD`;$("#result").textContent=val;$("#fill").style.width=Math.min(100,p)+"%";$("#tiles").innerHTML=`<div><b>${Math.min(100,p).toFixed(0)}%</b><br>uso estimado</div><div><b>R$ ${c}</b><br>por mês</div><div><b>R$ ${(c/a).toFixed(2)}</b><br>por unidade</div>`}$("#go").onclick=go;go()})();</script></body></html>
