<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aposentadoria INSS</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:45px 0;background:#f2f7f1}.route{padding:45px 0}.rails{display:grid;grid-template-columns:270px 1fr;gap:28px}.profile{padding:23px}.track{position:relative;padding:26px}.track:before{content:"";position:absolute;left:49px;top:78px;bottom:50px;width:5px;background:#d9e4df}.gate{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:15px;margin-bottom:12px;border:1px solid var(--line);border-radius:15px;background:#fff}.dot{z-index:1;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#dfeae6;font-weight:950}.gate.ok .dot{background:#438a69;color:white}.gate.best{border:2px solid #d77d45}.tag{padding:6px 9px;border-radius:99px;background:#fff0e6;color:#9a4d20;font-size:12px;font-weight:900}.finish{padding:20px;background:#e9f3ef;border-radius:16px;margin-top:20px}.finish strong{font-size:31px;color:#276d55}@media(max-width:800px){.rails{grid-template-columns:1fr}.hero .wrap{display:block!important}}</style></head><body><header class="hc-head"><b class="hc-brand">Hacé Cuentas</b><nav class="hc-nav">Trabalho · INSS</nav><div class="hc-tools"><button>BR ▾</button></div></header><section class="hero"><div class="wrap"><div class="crumb">Trabalho / Aposentadoria INSS</div><h1 class="display">Qual regra leva você primeiro à aposentadoria?</h1><p class="lead">Colocamos idade, contribuição e transições na mesma trilha — sem obrigar você a adivinhar a regra.</p></div></section><main class="route"><div class="wrap rails"><aside class="card profile"><b>Seu ponto de partida</b><label>Idade</label><input id="age" type="number" value="59"><label>Anos de contribuição</label><input id="years" type="number" value="31"><label>Perfil</label><select id="sex"><option value="f">Mulher</option><option value="m">Homem</option></select><button class="btn" id="calc" style="width:100%;margin-top:18px">Traçar meu caminho</button></aside><section class="card track" id="track"></section></div></main><footer class="foot">Simulação educativa. Confirme vínculos no Meu INSS.</footer><script>(()=>{let $=s=>document.querySelector(s);function go(){let a=+$(`#age`).value,y=+$(`#years`).value,f=$(`#sex`).value==="f",min=f?62:65,need=f?30:35,gap=Math.max(min-a,need-y,0),rules=[["Regra permanente",a>=min&&y>=15,`${min} anos + carência`],["Sistema de pontos",a+y>=(f?92:102)&&y>=need,`${a+y} pontos hoje`],["Idade progressiva",a>=(f?59:64)&&y>=need,"transição anual"],["Pedágio de 100%",y>=need,"benefício integral"]];$(`#track`).innerHTML=`<b class=eyebrow>TRILHAS POSSÍVEIS</b>`+rules.map((r,i)=>`<div class="gate ${r[1]?"ok":""} ${i===0?"best":""}"><span class=dot>${r[1]?"✓":i+1}</span><div><b>${r[0]}</b><small style="display:block;color:#61727a">${r[2]}</small></div><span class=tag>${r[1]?"já cumpre":"a caminho"}</span></div>`).join("")+`<div class=finish>Estimativa mais próxima<br><strong>${gap?`faltam cerca de ${gap} anos`:"você já pode cumprir uma regra"}</strong><p>O resultado real depende do CNIS e das regras específicas do seu histórico.</p></div>`}$("#calc").onclick=go;go()})();</script></body></html>
