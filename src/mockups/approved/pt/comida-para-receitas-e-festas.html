<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comida para receitas e festas</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#fff8e8}.tabletop{padding:45px 0}.setup{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}.table{margin-top:25px;padding:30px;border-radius:90px;background:#b86f48;box-shadow:inset 0 0 0 14px #8f5033;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.plate{aspect-ratio:1;border-radius:50%;background:#fffaf0;border:7px solid #eadfc9;display:grid;place-items:center;text-align:center;padding:15px}.plate b{font-size:24px}.shopping{margin-top:22px;display:flex;gap:10px;overflow:auto}.item{min-width:180px;padding:14px;border-left:6px solid #4e8b6b;background:#f5f8f5;border-radius:9px}@media(max-width:800px){.setup{grid-template-columns:1fr 1fr}.table{grid-template-columns:1fr 1fr;border-radius:30px}.plate{aspect-ratio:auto;min-height:130px}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Vida · Mesa</nav><div class=hc-tools><button>BR ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Vida / Comida para receitas e festas</div><h1 class=display>Monte a mesa antes de ir ao mercado.</h1><p class=lead>Adultos, crianças e duração da festa viram porções e uma lista comprável.</p></div></section><main class=tabletop><div class=wrap><div class=setup><div><label>Adultos</label><input id=a type=number value=12></div><div><label>Crianças</label><input id=k type=number value=5></div><div><label>Tipo de encontro</label><select id=t><option value=1>Almoço completo</option><option value=.7>Petiscos</option><option value=1.15>Churrasco</option></select></div><button class=btn id=go>Servir a mesa</button></div><section class=table id=table></section><div class=shopping id=shop></div></div></main><footer class=foot>Margem incluída para não faltar, sem exagerar nas sobras.</footer><script>(()=>{let $=s=>document.querySelector(s);function go(){let n=+$("#a").value + +$("#k").value*.55,m=+$("#t").value,vals=[["Proteína",n*.32*m,"kg"],["Acompanhamento",n*.2*m,"kg"],["Bebidas",n*.8*m,"L"],["Sobremesa",n*.11*m,"kg"]];$("#table").innerHTML=vals.map(x=>`<div class=plate><div><b>${x[1].toFixed(1)} ${x[2]}</b><br>${x[0]}</div></div>`).join("");$("#shop").innerHTML=vals.map((x,i)=>`<div class=item><b>${x[0]}</b><br>Comprar ${Math.ceil(x[1]*10)/10} ${x[2]}<br><small>${i===2?"Separe água e opções sem álcool":"Inclui 10% de segurança"}</small></div>`).join("")}$("#go").onclick=go;go()})();</script></body></html>
