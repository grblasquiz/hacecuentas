<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Férias, baixas e licenças</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#eef5f6}.leave{padding:45px 0}.types{display:flex;gap:8px;flex-wrap:wrap}.types button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:99px}.types .on{background:#337583;color:#fff}.year{margin-top:25px;display:grid;grid-template-columns:repeat(12,1fr);gap:5px}.month{border:1px solid var(--line);border-radius:8px;padding:9px;min-height:100px}.band{height:28px;margin-top:12px;background:#dbe7e4;border-radius:5px}.band.active{background:#d3764c}.case{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px}.case>div{padding:18px;background:#f4f7f6;border-radius:12px}.case strong{font-size:25px;color:#316f79}.notice{margin-top:18px;padding:16px;border-left:7px solid #d3764c;background:#fff3eb}@media(max-width:800px){.year{overflow:auto}.month{min-width:80px}.case{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · Trabalho</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Trabalho / Férias, baixas e licenças</div><h1 class=display>Marque a ausência e veja quem paga cada dia.</h1><p class=lead>Férias, doença e parentalidade com duração, remuneração e próximos passos.</p></div></section><main class=leave><div class=wrap><div class=types><button data-t=0 class=on>Férias</button><button data-t=1>Baixa médica</button><button data-t=2>Licença parental</button><button data-t=3>Layoff</button><button data-t=4>Saída do emprego</button></div><div style="max-width:320px"><label>Mês de início</label><select id=start></select></div><div class=year id=year></div><div class=case id=case></div><div class=notice id=notice></div></div></main><footer class=foot>Confirme prazos e percentagens na Segurança Social e com a entidade empregadora.</footer><script>(()=>{let t=0,$=s=>document.querySelector(s),months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],data=[["22 dias úteis","100% + subsídio","Empregador","Marcar por acordo e guardar saldo."],["dias certificados","55%–75%","Segurança Social","Baixa deve ser certificada; há períodos de espera."],["120 ou 150 dias","80%–100%","Segurança Social","Escolha modalidade e partilha entre progenitores."],["período acordado","mínimo legal","Empresa + SS","Confirme redução e plano comunicado."],["aviso prévio","acerto final","Empregador","Confira férias, subsídios e prazo de aviso."]];$("#start").innerHTML=months.map((m,i)=>`<option value=${i}>${m}</option>`).join("");document.querySelectorAll(".types button").forEach(x=>x.onclick=()=>{document.querySelector(".types .on").classList.remove("on");x.classList.add("on");t=+x.dataset.t;go()});function go(){let s=+$("#start").value,len=[1,1,5,3,1][t];$("#year").innerHTML=months.map((m,i)=>`<div class=month><b>${m}</b><div class="band ${i>=s&&i<s+len?"active":""}"></div></div>`).join("");$("#case").innerHTML=`<div>Duração de referência<br><strong>${data[t][0]}</strong></div><div>Remuneração<br><strong>${data[t][1]}</strong></div><div>Quem paga<br><strong>${data[t][2]}</strong></div>`;$("#notice").innerHTML=`<b>Próximo passo</b><br>${data[t][3]}`}$("#start").onchange=go;go()})();</script></body></html>
