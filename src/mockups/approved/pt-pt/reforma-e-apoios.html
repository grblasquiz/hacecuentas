<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reforma e apoios</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f3f0f7}.safety{padding:45px 0}.inputs{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}.ladder{margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:8px;height:350px}.step{padding:18px;border-radius:15px 15px 0 0;background:#ece8f2;min-height:var(--h);display:flex;flex-direction:column;justify-content:flex-end}.step.on{background:#77649a;color:#fff}.step strong{font-size:25px}.gap{margin-top:18px;padding:18px;background:#fff4e3;border-left:7px solid #d69a42}@media(max-width:800px){.inputs{grid-template-columns:1fr 1fr}.ladder{overflow:auto}.step{min-width:150px}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · Reforma</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Finanças / Reforma e apoios</div><h1 class=display>Veja que degrau sustenta o seu rendimento.</h1><p class=lead>Reforma, complemento solidário e RSI organizados pela lacuna que precisa de cobrir.</p></div></section><main class=safety><div class=wrap><div class=inputs><div><label>Idade</label><input id=age type=number value=68></div><div><label>Pensão mensal (€)</label><input id=pension type=number value=520></div><div><label>Outros rendimentos (€)</label><input id=other type=number value=80></div><button class=btn id=go>Ver rede de apoio</button></div><section class=ladder id=ladder></section><div class=gap id=gap></div></div></main><footer class=foot>Triagem indicativa; património, agregado e residência influenciam o acesso.</footer><script>(()=>{let $=s=>document.querySelector(s);function go(){let a=+$("#age").value,p=+$("#pension").value,o=+$("#other").value,total=p+o,target=870,csi=a>=66&&total<650?Math.min(250,650-total):0,rsi=total+csi<400?400-total-csi:0,vals=[["Pensão",p,1],["CSI",csi,csi>0],["RSI",rsi,rsi>0],["Meta mensal",target,0]];$("#ladder").innerHTML=vals.map(x=>`<div class="step ${x[2]?"on":""}" style="--h:${Math.max(80,x[1]/target*300)}px"><small>${x[0]}</small><strong>€ ${x[1].toFixed(0)}</strong></div>`).join("");let after=total+csi+rsi;$("#gap").innerHTML=`<b>Rendimento após apoios simulados: € ${after.toFixed(0)}</b><br>Ainda faltariam € ${Math.max(0,target-after).toFixed(0)} para a meta escolhida. Consulte Segurança Social Direta.`}$("#go").onclick=go;go()})();</script></body></html>
