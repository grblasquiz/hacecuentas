<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impostos do automóvel</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f3f5ef}.road{padding:45px 0}.passport{display:grid;grid-template-columns:1fr 1fr;gap:24px}.vehicle{padding:25px}.plate{display:inline-block;border:4px solid #202f34;border-radius:6px;padding:8px 20px;background:#fff;font:bold 26px monospace;margin-bottom:20px}.ticket{padding:25px;background:#fffdf3}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #aab7b2;padding:13px 0}.total{font-size:38px;font-weight:950;color:#2f7161}.compare{margin-top:20px;padding:17px;border-radius:13px;background:#e5f2ed}.ev{color:#26705a;font-weight:900}@media(max-width:800px){.passport{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · Automóvel</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Finanças / Impostos do automóvel</div><h1 class=display>O passaporte fiscal do seu carro.</h1><p class=lead>Antecipe ISV na compra e IUC em cada ano, com motor e emissões à vista.</p></div></section><main class=road><div class="wrap passport"><section class="card vehicle"><div class=plate>PT · 26</div><label>Combustível</label><select id=fuel><option value=1>Gasolina</option><option value=1.12>Gasóleo</option><option value=0>Elétrico</option></select><label>Cilindrada (cm³)</label><input id=cc type=number value=1498><label>CO₂ (g/km)</label><input id=co2 type=number value=122><label>Ano da matrícula</label><input id=year type=number value=2023><button class=btn id=go style="margin-top:18px;width:100%">Emitir estimativa</button></section><section class="card ticket"><h2>Talão fiscal</h2><div id=lines></div><div class=compare id=compare></div></section></div></main><footer class=foot>Estimativa simplificada. Tabelas oficiais variam por ciclo de emissões e categoria.</footer><script>(()=>{let $=s=>document.querySelector(s);function go(){let f=+$("#fuel").value,cc=+$("#cc").value,c=+$("#co2").value;if(!f){$("#lines").innerHTML=`<div class=line><span>ISV</span><b>€ 0</b></div><div class=line><span>IUC anual</span><b>€ 0</b></div><div class=total>Isento neste cenário</div>`;$("#compare").innerHTML="<span class=ev>Elétrico:</span> confirme incentivos e tributação autónoma aplicáveis.";return}let isv=Math.max(0,(cc-1000)*1.8+(c-80)*38)*f,iuc=(cc*.045+Math.max(0,c-100)*1.6)*f;$("#lines").innerHTML=`<div class=line><span>ISV na matrícula/importação</span><b>€ ${isv.toFixed(0)}</b></div><div class=line><span>IUC anual</span><b>€ ${iuc.toFixed(0)}</b></div><div class=line><span>Primeiro ano</span><b>€ ${(isv+iuc).toFixed(0)}</b></div><div class=total>Depois: € ${iuc.toFixed(0)}/ano</div>`;$("#compare").textContent=`Um elétrico pouparia aproximadamente € ${(isv+iuc*5).toFixed(0)} em impostos ao longo de 5 anos.`}$("#go").onclick=go;go()})();</script></body></html>
