<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impostos da casa</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#eef4f2}.property{padding:45px 0}.tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:10px;font-weight:850}.tabs .on{background:#337462;color:#fff}.deed{margin-top:20px;display:grid;grid-template-columns:330px 1fr;gap:24px}.form,.calendar{padding:24px}.house{height:100px;background:#e5eee9;clip-path:polygon(50% 0,100% 40%,90% 40%,90% 100%,10% 100%,10% 40%,0 40%);margin-bottom:20px}.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.date{padding:16px;border-top:6px solid #d57c4a;background:#fff7ef}.bill{margin-top:20px;padding:20px;background:#294f55;color:#fff}.bill strong{font-size:38px}@media(max-width:800px){.deed{grid-template-columns:1fr}.dates{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · Casa</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Impostos / Casa</div><h1 class=display>Comprar, ter ou herdar: a casa muda de imposto.</h1><p class=lead>Escolha o momento e veja o custo e o calendário que realmente interessam.</p></div></section><main class=property><div class=wrap><div class=tabs><button data-m=0 class=on>Comprar</button><button data-m=1>Ser proprietário</button><button data-m=2>Herdar</button></div><div class=deed><aside class="card form"><div class=house></div><label>Valor do imóvel / VPT (€)</label><input id=value type=number value=220000><label>Finalidade</label><select id=use><option value=1>Habitação própria</option><option value=1.18>Segunda habitação</option></select><button class=btn id=go style="margin-top:18px;width:100%">Calcular esta fase</button></aside><section class="card calendar"><div class=dates id=dates></div><div class=bill id=bill></div></section></div></div></main><footer class=foot>Taxas municipais e isenções podem alterar o resultado.</footer><script>(()=>{let mode=0,$=s=>document.querySelector(s);document.querySelectorAll(".tabs button").forEach(x=>x.onclick=()=>{document.querySelector(".tabs .on").classList.remove("on");x.classList.add("on");mode=+x.dataset.m;go()});function go(){let v=+$("#value").value,u=+$("#use").value,amount=mode===0?v*(.008+.006*u):mode===1?v*.0034: v*.1,labels=mode===0?[["Antes da escritura","Simular IMT"],["Na escritura","Pagar IMT + selo"],["Depois","Registar imóvel"]]:mode===1?[["Abril","1ª prestação IMI"],["Julho","2ª se aplicável"],["Novembro","3ª se aplicável"]]:[["Óbito","Comunicar cabeça de casal"],["3 meses","Participar às Finanças"],["Partilha","Selo se não isento"]];$("#dates").innerHTML=labels.map(x=>`<div class=date><b>${x[0]}</b><br>${x[1]}</div>`).join("");$("#bill").innerHTML=`Custo estimado nesta fase<br><strong>€ ${amount.toLocaleString("pt-PT",{maximumFractionDigits:0})}</strong><br><small>${mode===2?"Cônjuge, descendentes e ascendentes podem estar isentos de selo.":"Confirme VPT, município e eventuais isenções."}</small>`}$("#go").onclick=go;go()})();</script></body></html>
