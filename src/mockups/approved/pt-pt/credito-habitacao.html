<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crédito habitação</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#edf5f2}.bank{padding:45px 0}.mortgage{display:grid;grid-template-columns:330px 1fr;gap:25px}.form{padding:24px}.stress{padding:26px}.meter{height:26px;border-radius:99px;background:linear-gradient(90deg,#4c9975 0 35%,#e5b24e 35% 50%,#c45b49 50%);position:relative}.needle{position:absolute;top:-8px;width:4px;height:42px;background:#173b44;left:30%;transition:.2s}.scenario{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.scenario div{padding:15px;border-radius:12px;background:#f3f7f5}.scenario strong{font-size:25px}.fork{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.fork button{padding:15px;border:1px solid var(--line);background:#fff;border-radius:10px}.fork button:hover{border-color:#2d7562}.decision{margin-top:12px;padding:15px;background:#e5f1ec}@media(max-width:800px){.mortgage{grid-template-columns:1fr}.scenario{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · Habitação</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Finanças / Crédito habitação</div><h1 class=display>A prestação cabe hoje. E se a Euribor subir?</h1><p class=lead>Teste esforço, entrada e taxa antes de escolher o banco.</p></div></section><main class=bank><div class="wrap mortgage"><aside class="card form"><label>Preço da casa (€)</label><input id=price type=number value=240000><label>Entrada (€)</label><input id=down type=number value=48000><label>Prazo (anos)</label><input id=years type=number value=30><label>Rendimento líquido mensal (€)</label><input id=income type=number value=3200><button class=btn id=go style="width:100%;margin-top:18px">Testar crédito</button></aside><section class="card stress"><h2>Teste de esforço</h2><div class=meter><div class=needle id=needle></div></div><div class=scenario id=scenario></div><div class=fork><button id=amort>Amortizar € 10.000</button><button id=save>Guardar em certificados</button></div><div class=decision id=decision>Escolha uma opção para comparar.</div></section></div></main><footer class=foot>Simulação não constitui proposta de crédito; inclui apenas capital e juros.</footer><script>(()=>{let $=s=>document.querySelector(s),loan=0,base=0;function pmt(rate){let n=+$("#years").value*12,r=rate/12;return loan*r/(1-(1+r)**-n)}function go(){loan=+$("#price").value-+$("#down").value;base=pmt(.04);let inc=+$("#income").value,eff=base/inc*100;$("#needle").style.left=Math.min(98,eff)+"%";$("#scenario").innerHTML=[[3,"Taxa baixa"],[4,"Taxa atual"],[6,"Choque +2 pp"]].map(x=>`<div>${x[1]}<br><strong>€ ${pmt(x[0]/100).toFixed(0)}</strong><br>${(pmt(x[0]/100)/inc*100).toFixed(0)}% esforço</div>`).join("")}$("#amort").onclick=()=>{$("#decision").textContent=`Amortizar reduz a prestação em cerca de € ${(base-pmt(.04)*(loan-10000)/loan).toFixed(0)}/mês, antes de comissão.`};$("#save").onclick=()=>{$("#decision").textContent="Guardar preserva liquidez; compare a taxa líquida dos certificados com a TAEG do crédito."};$("#go").onclick=go;go()})();</script></body></html>
