<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRS</title><link rel="stylesheet" href="pt-mockup-core.css"><style>.hero{padding:42px 0;background:#f5f1ea}.tax{padding:45px 0}.return{display:grid;grid-template-columns:340px 1fr;gap:25px}.form,.settlement{padding:24px}.status{display:flex;gap:7px}.status button{flex:1;border:1px solid var(--line);background:#fff;padding:10px}.status .on{background:#316d75;color:#fff}.settlement{background:#fffefa;font-family:ui-monospace,monospace}.line{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px dotted #99aaa4}.refund{padding:20px;margin-top:20px;border:3px double #397862}.refund strong{font:950 40px system-ui;color:#397862}.separate{margin-top:16px;padding:13px;background:#f0f5f3;font-family:system-ui}@media(max-width:800px){.return{grid-template-columns:1fr}}</style></head><body><header class=hc-head><b class=hc-brand>Hacé Cuentas</b><nav class=hc-nav>Portugal · IRS</nav><div class=hc-tools><button>PT ▾</button></div></header><section class=hero><div class=wrap><div class=crumb>Impostos / IRS</div><h1 class=display>Leia a liquidação antes de entregar.</h1><p class=lead>Rendimento, retenções e deduções traduzidos numa folha que explica reembolso ou pagamento.</p></div></section><main class=tax><div class="wrap return"><aside class="card form"><label>Situação</label><div class=status><button data-m=1 class=on>Individual</button><button data-m=2>Casal</button></div><label>Rendimento bruto anual (€)</label><input id=income type=number value=32000><label>Retenção já feita (€)</label><input id=withheld type=number value=4700><label>Deduções à coleta (€)</label><input id=deduct type=number value=850><button class=btn id=go style="width:100%;margin-top:18px">Pré-preencher liquidação</button></aside><section class="card settlement"><h2>DEMONSTRAÇÃO DE LIQUIDAÇÃO</h2><div id=lines></div><div class=refund id=result></div><div class=separate id=compare></div></section></div></main><footer class=foot>Estimativa pedagógica; escalões, quociente familiar e anexos alteram o IRS real.</footer><script>(()=>{let members=1,$=s=>document.querySelector(s);document.querySelectorAll(".status button").forEach(x=>x.onclick=()=>{document.querySelector(".status .on").classList.remove("on");x.classList.add("on");members=+x.dataset.m;go()});function go(){let inc=+$("#income").value,wh=+$("#withheld").value,ded=+$("#deduct").value,tax=Math.max(0,(inc/members-8200)*.19*members-ded),balance=wh-tax,fmt=v=>"€ "+Math.abs(v).toLocaleString("pt-PT",{maximumFractionDigits:0});$("#lines").innerHTML=`<div class=line><span>Rendimento global</span><b>€ ${inc}</b></div><div class=line><span>Coleta estimada</span><b>€ ${tax.toFixed(0)}</b></div><div class=line><span>Retenções na fonte</span><b>− € ${wh}</b></div><div class=line><span>Deduções</span><b>− € ${ded}</b></div>`;$("#result").innerHTML=`${balance>=0?"Reembolso previsto":"Valor a pagar"}<br><strong>${fmt(balance)}</strong>`;$("#compare").textContent=members===2?"Compare tributação conjunta com duas simulações individuais antes de submeter.":"Se vive em casal, teste também a tributação conjunta."}$("#go").onclick=go;go()})();</script></body></html>
