<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#b15b34}.hero{background:#fff3e9}.kicker{color:var(--a)}.price{font-size:3rem;font-weight:950}.layers div{padding:15px;color:white}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Consumo</nav></div></header><section class=hero><div class=shell><div class=kicker>Precio por capas</div><h1>¿Qué impuesto viene adentro?</h1><p>Desarmá restaurante, licor, bebida azucarada, importación o premio.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Compra<select id=t><option value=".08">Restaurante</option><option value=".25">Licor</option><option value=".19">Importación</option><option value=".2">Premio</option></select></label><label>Precio final<input id=a type=number value=180000></label><button id=b class=primary>Separar etiqueta</button></div><div class=card><div id=total class=price></div><div class=layers><div style="background:#496e7b" id=base></div><div style="background:#d16b3f" id=tax></div></div></div></div></main><footer class=site-footer><div class=shell>Algunos productos combinan IVA e impuesto al consumo.</div></footer><script>function go(){let x=+a.value,r=+t.value,q=x/(1+r),f=n=>"$ "+Math.round(n).toLocaleString("es-CO");total.textContent=f(x);base.textContent="Precio sin impuesto "+f(q);tax.textContent="Impuesto incluido "+f(x-q)}b.onclick=go;[t,a].forEach(x=>x.oninput=go);go()</script></body></html>
