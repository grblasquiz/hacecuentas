<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#d16b3f}.hero{background:#fff0e8}.kicker{color:var(--a)}.garage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bay{padding:20px;background:white;border-radius:18px 18px 5px 5px;border-top:8px solid var(--a)}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Carro</nav></div></header><section class=hero><div class=shell><div class=kicker>Tu garaje anual</div><h1>¿Cuánto cuesta de verdad tener el carro?</h1><p>Impuesto, SOAT, tecnomecánica, combustible y taller dentro del mismo garaje.</p></div></section><main class=work><div class=shell><div class="card grid3"><label>Valor comercial<input id=v type=number value=65000000></label><label>Km al mes<input id=k type=number value=1000></label><label>Combustible mensual<input id=f type=number value=550000></label><button id=b class=primary>Actualizar garaje</button></div><div id=g class=garage></div><div class=card><b id=t></b></div></div></main><footer class=site-footer><div class=shell>Valores orientativos por ciudad y vehículo.</div></footer><script>const cop=n=>"$ "+Math.round(n).toLocaleString("es-CO");function go(){let a=+v.value,x=[["Impuesto",a*.025],["SOAT",780000],["RTM",320000],["Combustible",+f.value*12],["Taller",1800000],["Parqueo",2400000]];g.innerHTML=x.map(q=>`<div class=bay><small>${q[0]}</small><h3>${cop(q[1])}</h3></div>`).join("");let z=x.reduce((s,q)=>s+q[1],0);t.textContent=`Total ${cop(z)} · ${cop(z/(+k.value*12||1))} por km`}b.onclick=go;[v,k,f].forEach(x=>x.oninput=go);go()</script></body></html>
