<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#39758c}.hero{background:#ebf6fa}.kicker{color:var(--a)}.vault{border:14px solid #52636b;border-radius:36px;background:#e6eef1;padding:30px;text-align:center}.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.door{padding:18px;border-radius:16px;background:white;border:0}.door.on{background:var(--a);color:white}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Cesantías</nav></div></header><section class=hero><div class=shell><div class=kicker>Tu bóveda laboral</div><h1>¿Retirar, trasladar o dejar quietas las cesantías?</h1><p>Probá cada puerta y mirá qué protege o habilita.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Saldo<input id=s type=number value=9000000></label><label>Rendimiento esperado (%)<input id=r type=number value=7></label><button id=b class=primary>Actualizar bóveda</button></div><div class=vault><h2 id=balance></h2><div id=doors class=doors><button class="door on" data-x=keep>Dejar</button><button class=door data-x=home>Vivienda</button><button class=door data-x=study>Educación</button></div><p id=msg></p></div></div></main><footer class=site-footer><div class=shell">El retiro exige causal y soportes.</div></footer><script>let x="keep";function go(){let v=+s.value;balance.textContent="$ "+Math.round(v).toLocaleString("es-CO");msg.textContent=x==="keep"?`En 12 meses: $ ${Math.round(v*(1+r.value/100)).toLocaleString("es-CO")}`:x==="home"?"Disponible para compra, mejora o liberación de gravamen.":"Disponible para matrícula propia o de dependientes."}doors.onclick=e=>{if(e.target.dataset.x){x=e.target.dataset.x;[...doors.children].forEach(q=>q.classList.toggle("on",q===e.target));go()}};b.onclick=go;[s,r].forEach(q=>q.oninput=go);go()</script></body></html>
