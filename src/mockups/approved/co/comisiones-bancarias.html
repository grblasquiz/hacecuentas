<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#318c83}.hero{background:#eaf8f6}.kicker{color:var(--a)}.pipe{background:#d7eeea;padding:20px;border-radius:40px;display:flex;gap:8px}.leak{flex:1;background:white;padding:16px;border-radius:20px;text-align:center}.primary{background:var(--a)}@media(max-width:700px){.pipe{flex-direction:column}}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Bancos</nav></div></header><section class=hero><div class=shell><div class=kicker>Detectá las fugas</div><h1>¿Cuánto pierde tu plata al moverse?</h1><p>4×1000, transferencias, retiros y manejo aparecen en el punto exacto de la tubería.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Movimiento mensual<input id=m type=number value=8000000></label><label>Cuenta exenta<select id=e><option value=1>Sí</option><option value=0>No</option></select></label><label>Transferencias a otros bancos<input id=n type=number value=6></label><button id=b class=primary>Encontrar fugas</button></div><div><div class=pipe id=p></div><div class="notice card" id=z></div></div></div></main><footer class=site-footer><div class=shell>Consultá el tarifario de tu entidad.</div></footer><script>const c=n=>"$ "+Math.round(n).toLocaleString("es-CO");function go(){let x=+m.value,g=+e.value?Math.max(0,x-16000000)*.004:x*.004,tr=+n.value*6500,mf=15000;p.innerHTML=[["4×1000",g],["Transferencias",tr],["Manejo",mf]].map(q=>`<div class=leak><b>${q[0]}</b><h3>${c(q[1])}</h3></div>`).join("");z.textContent=`Fuga mensual ${c(g+tr+mf)} · anual ${c((g+tr+mf)*12)}`}b.onclick=go;[m,e,n].forEach(x=>x.oninput=go);go()</script></body></html>
