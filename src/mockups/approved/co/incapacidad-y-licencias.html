<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#318b78}.hero{background:#eaf8f4}.kicker{color:var(--a)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:14px 5px;text-align:center;border-radius:10px;background:white}.emp{border-bottom:5px solid #e5a54e}.eps{border-bottom:5px solid var(--a)}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Licencias</nav></div></header><section class=hero><div class=shell><div class=kicker>Quién paga cada día</div><h1>Incapacidad o licencia: seguí el dinero</h1><p>El calendario cambia de pagador y porcentaje según el evento y la duración.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Evento<select id=e><option value=.667>Enfermedad común</option><option value=1>Maternidad</option><option value=1>Paternidad</option></select></label><label>Salario / IBC<input id=s type=number value=2500000></label><label>Días<input id=d type=number value=15></label><button id=b class=primary>Armar calendario</button></div><div><div id=cal class=calendar></div><div class="notice card" id=sum></div></div></div></main><footer class=site-footer><div class=shell">Pagador y base dependen del origen y las cotizaciones.</div></footer><script>const c=n=>"$ "+Math.round(n).toLocaleString("es-CO");function go(){let n=+d.value,r=+e.value;cal.innerHTML=Array.from({length:Math.min(n,35)},(_,i)=>`<div class="day ${i<2?"emp":"eps"}">${i+1}</div>`).join("");sum.textContent=`Pago estimado ${c(+s.value/30*n*r)} · ${n>2?"empleador días 1–2, EPS desde el 3":"empleador"}`}b.onclick=go;[e,s,d].forEach(x=>x.oninput=go);go()</script></body></html>
