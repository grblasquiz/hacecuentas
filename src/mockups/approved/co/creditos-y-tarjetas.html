<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#7756a5}.hero{background:#f3effa}.kicker{color:var(--a)}.stairs{display:flex;align-items:end;gap:8px;height:260px}.step{flex:1;background:#e5daf3;padding:12px;border-radius:10px 10px 0 0}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Crédito</nav></div></header><section class=hero><div class=shell><div class=kicker>Escalera de cuotas</div><h1>¿Cuánto de la cuota es interés?</h1><p>Visualizá cómo cada pago te acerca a salir de la deuda.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Saldo<input id=a type=number value=12000000></label><label>Tasa EA (%)<input id=r type=number value=28></label><label>Meses<input id=n type=number value=24></label><button id=b class=primary>Construir escalera</button></div><div class=card><div class=stairs id=s></div><h2 id=q></h2></div></div></main><footer class=site-footer><div class=shell>Incluí seguros y comisiones del producto real.</div></footer><script>const c=n=>"$ "+Math.round(n).toLocaleString("es-CO");function go(){let p=+a.value,i=Math.pow(1+(+r.value/100),1/12)-1,m=+n.value,x=p*i*Math.pow(1+i,m)/(Math.pow(1+i,m)-1);q.textContent=`Cuota ${c(x)} · total ${c(x*m)}`;s.innerHTML=[1,.8,.6,.4,.2].map((v,j)=>`<div class=step style="height:${50+v*170}px"><small>Mes ${Math.round(m*j/4+1)}</small><br>${c(p*v)}</div>`).join("")}b.onclick=go;[a,r,n].forEach(x=>x.oninput=go);go()</script></body></html>
