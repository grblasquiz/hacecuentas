<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#3f6da1}.hero{background:#edf4fc}.kicker{color:var(--a)}.counter{font-size:clamp(4rem,12vw,9rem);font-weight:950;color:var(--a);line-height:1}.route{padding:20px;border-left:8px solid var(--a);background:white}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><a class=brand>▣ Hacé Cuentas</a><nav>Colombia · Pensión</nav></div></header><section class=hero><div class=shell><div class=kicker>Semanas, no intuiciones</div><h1>¿Cuánto falta para pensionarte?</h1><p>Contá semanas y edad antes de proyectar la mesada.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Sistema<select id=s><option value=1300>Colpensiones</option><option value=1150>Fondo privado</option></select></label><label>Semanas actuales<input id=w type=number value=850></label><label>Edad<input id=a type=number value=48></label><label>Ingreso base<input id=i type=number value=3500000></label><button id=b class=primary>Contar camino</button></div><div><div id=left class=counter></div><div class=route id=route></div></div></div></main><footer class=site-footer><div class=shell>La reforma y el régimen de transición pueden cambiar el análisis.</div></footer><script>function go(){let need=Math.max(0,+s.value-+w.value),yrs=Math.ceil(need/52);left.textContent=need;route.innerHTML=`<h2>semanas por completar</h2><p>A ritmo continuo: ${yrs} años. Edad aproximada: ${+a.value+yrs}.</p><b>Mesada base referencial: $ ${Math.round(+i.value*.65).toLocaleString("es-CO")}</b>`}b.onclick=go;[s,w,a,i].forEach(x=>x.oninput=go);go()</script></body></html>
