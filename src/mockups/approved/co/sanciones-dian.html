<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="latam-58-core.css">
  <style>
    :root{--a:#187a5b}
    .hero{background:#eaf7f1}
    .kicker{color:var(--a)}
    .timeline{height:18px;background:linear-gradient(90deg,#bfe8d4,#58b68c,#187a5b);border-radius:20px;position:relative}
    .pin{position:absolute;top:-12px;width:10px;height:42px;background:#25483d}
    .primary{background:var(--a)}
    .urgent{padding:22px;background:#fff;border:2px solid #b9ddcd;border-radius:18px}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell nav"><a class="brand">▣ Hacé Cuentas</a><nav>Colombia · DIAN</nav></div></header>
  <section class="hero"><div class="shell"><div class="kicker">La mora crece</div><h1>¿Cuánto cuesta esperar un mes más?</h1><p>Ubicá el atraso y mirá sanción, intereses y próxima acción.</p></div></section>
  <main class="work"><div class="shell grid2">
    <div class="card">
      <label>Impuesto a cargo<input id="a" type="number" value="5000000"></label>
      <label>Meses sin declarar<input id="m" type="number" value="3"></label>
      <label>Días sin pagar<input id="d" type="number" value="45"></label>
      <button id="b" class="primary">Ponerme al día</button>
    </div>
    <div class="urgent"><div class="timeline"><i id="p" class="pin"></i></div><h2 id="cost"></h2><p id="detail"></p></div>
  </div></main>
  <footer class="site-footer"><div class="shell">La sanción mínima y la UVT vigente pueden dominar el cálculo.</div></footer>
  <script>
    const c=n=>"$ "+Math.round(n).toLocaleString("es-CO");
    function go(){
      let x=+a.value,s=Math.max(470650,x*.05*+m.value),it=x*.00055*+d.value;
      p.style.left=Math.min(96,+m.value*8)+"%";
      cost.textContent=`Costo estimado ${c(s+it)}`;
      detail.textContent=`Sanción ${c(s)} + intereses ${c(it)}. Presentar y pagar hoy frena el crecimiento.`;
    }
    b.onclick=go;[a,m,d].forEach(x=>x.oninput=go);go();
  </script>
</body>
</html>
