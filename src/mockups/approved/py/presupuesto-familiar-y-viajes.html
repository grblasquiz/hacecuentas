<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#735b9e}.hero{background:#f3eef9}.kicker{color:var(--a)}.case{border:10px solid #6c5b48;border-radius:25px;background:#e9c995;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.pocket{background:#fff9ed;padding:18px;border-radius:14px}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Familia y viajes</nav></div></header><section class=hero><div class=shell><div class=kicker>La valija del mes</div><h1>¿Alcanza para vivir y viajar?</h1><p>Separá el presupuesto cotidiano de la meta del viaje.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Ingreso familiar<input id=i type=number value=8500000></label><label>Gastos fijos<input id=f type=number value=6100000></label><label>Meta del viaje<input id=t type=number value=12000000></label><button id=b class=primary>Armar valija</button></div><div class=case id=c></div></div></main><footer class=site-footer><div class=shell>Presupuesto en guaraníes corrientes.</div></footer><script>const g=n=>"Gs. "+Math.round(n).toLocaleString("es-PY");function go(){let m=+i.value-+f.value;c.innerHTML=`<div class=pocket><b>Mes libre</b><h3>${g(m)}</h3></div><div class=pocket><b>Meses hasta viajar</b><h3>${Math.ceil(+t.value/Math.max(1,m))}</h3></div><div class=pocket><b>Viaje</b><p>${g(+t.value)}</p></div><div class=pocket><b>Colchón sugerido</b><p>${g(+f.value*3)}</p></div>`}b.onclick=go;[i,f,t].forEach(x=>x.oninput=go);go()</script></body></html>
