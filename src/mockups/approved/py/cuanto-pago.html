<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#426f54}.hero{background:#edf6ef}.kicker{color:var(--a)}.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.branch{padding:20px;background:white;border-left:7px solid var(--a)}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Impuestos</nav></div></header><section class=hero><div class=shell><div class=kicker>Árbol tributario</div><h1>¿Cuánto pagás según cómo ganás?</h1><p>IRP, IRE, IVA e IPS nacen de ramas distintas.</p></div></section><main class=work><div class=shell><div class="card grid3"><label>Ingreso anual<input id=i type=number value=150000000></label><label>Gastos deducibles<input id=d type=number value=70000000></label><button id=b class=primary>Desplegar árbol</button></div><div id=t class=tree></div></div></main><footer class=site-footer><div class=shell>Topes y deducciones deben validarse con SET/DNIT.</div></footer><script>const g=n=>"Gs. "+Math.round(n).toLocaleString("es-PY");function go(){let net=Math.max(0,+i.value-+d.value);t.innerHTML=[["IRP",net*.08],["IRE",net*.1],["IVA ref.",+i.value*.1/1.1],["IPS independiente",+i.value*.13]].map(x=>`<div class=branch><b>${x[0]}</b><h3>${g(x[1])}</h3></div>`).join("")}b.onclick=go;[i,d].forEach(x=>x.oninput=go);go()</script></body></html>
