<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#5378a0}.hero{background:#edf4fa}.kicker{color:var(--a)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:14px;background:white;border-radius:9px}.off{background:#f4c7b7}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Trabajo</nav></div></header><section class=hero><div class=shell><div class=kicker>Almanaque laboral</div><h1>Días, jornal y constancias</h1><p>Transformá días trabajados en salario, vacaciones y preaviso.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Jornal diario<input id=j type=number value=120000></label><label>Días trabajados<input id=d type=number value=24></label><label>Antigüedad años<input id=a type=number value=4></label><button id=b class=primary>Marcar almanaque</button></div><div><div id=c class=calendar></div><div class="notice card" id=s></div></div></div></main><footer class=site-footer><div class=shell>Documentá ausencias y pagos.</div></footer><script>function go(){c.innerHTML=Array.from({length:30},(_,i)=>`<div class="day ${i>=d.value?"off":""}">${i+1}</div>`).join("");s.textContent=`Salario Gs. ${(+j.value*+d.value).toLocaleString("es-PY")} · vacaciones ${a.value<5?12:a.value<10?18:30} días`}b.onclick=go;[j,d,a].forEach(x=>x.oninput=go);go()</script></body></html>
