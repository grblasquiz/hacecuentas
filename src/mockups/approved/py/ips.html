<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#2f8978}.hero{background:#e9f8f4}.kicker{color:var(--a)}.wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.spoke{padding:22px;border-radius:50%;background:white;text-align:center;border:7px solid #b9dfd6}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · IPS</nav></div></header><section class=hero><div class=shell><div class=kicker>Una rueda de protección</div><h1>¿Cuánto aportás y qué te devuelve el IPS?</h1><p>Salud, maternidad, jubilación y costo patronal conectados.</p></div></section><main class=work><div class=shell><div class="card grid3"><label>Salario bruto<input id=s type=number value=3500000></label><label>Años aportados<input id=y type=number value=12></label><button id=b class=primary>Girar rueda</button></div><div id=w class=wheel></div></div></main><footer class=site-footer><div class=shell>La jubilación depende de edad y años.</div></footer><script>const g=n=>"Gs. "+Math.round(n).toLocaleString("es-PY");function go(){w.innerHTML=[["Aporte trabajador",s.value*.09],["Aporte empleador",s.value*.165],["Costo empresa",s.value*1.165],["Pensión ref.",s.value*Math.min(.8,.3+y.value*.015)]].map(x=>`<div class=spoke><b>${x[0]}</b><h3>${g(x[1])}</h3></div>`).join("")}b.onclick=go;[s,y].forEach(x=>x.oninput=go);go()</script></body></html>
