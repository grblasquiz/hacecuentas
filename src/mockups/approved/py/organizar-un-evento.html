<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#b75b79}.hero{background:#fff0f5}.kicker{color:var(--a)}.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#ead9c9;padding:25px}.table{aspect-ratio:1;border-radius:50%;background:white;border:8px solid #d09bb0;display:grid;place-items:center}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Evento</nav></div></header><section class=hero><div class=shell><div class=kicker>Plano y presupuesto</div><h1>Organizá el evento mesa por mesa</h1><p>Invitados, comida, bebida y guaraníes en el mismo salón.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Invitados<input id=n type=number value=80></label><label>Presupuesto<input id=p type=number value=18000000></label><button id=b class=primary>Armar salón</button><h2 id=pp></h2></div><div id=f class=floor></div></div></main><footer class=site-footer><div class=shell>Agregá 10% de contingencia.</div></footer><script>function go(){let q=Math.ceil(n.value/10);f.innerHTML=Array.from({length:q},(_,i)=>`<div class=table>Mesa ${i+1}</div>`).join("");pp.textContent=`Gs. ${Math.round(p.value/n.value).toLocaleString("es-PY")} por persona`}b.onclick=go;[n,p].forEach(x=>x.oninput=go);go()</script></body></html>
