<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#39816a}.hero{background:#eaf8f2}.kicker{color:var(--a)}.desk{display:grid;grid-template-columns:1fr 80px 1fr;background:#cfaa79;padding:25px;border-radius:30px}.bill{background:#eaf4d8;padding:25px;border:5px double #6c965d}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Cambio</nav></div></header><section class=hero><div class=shell><div class=kicker>Mesa de cambio</div><h1>¿Cuánto vale tu plata en guaraníes?</h1><p>Compra, venta, remesa e inflación sin confundir cotizaciones.</p></div></section><main class=work><div class=shell><div class=card><label>Monto<input id=a type=number value=1000></label><label>Moneda<select id=r><option value=7800>Dólar</option><option value=8500>Euro</option><option value=7>Peso argentino</option></select></label><button id=b class=primary>Cambiar billetes</button></div><div class=desk><div class=bill><small>Entregás</small><h2 id=from></h2></div><b>⇄</b><div class=bill><small>Recibís</small><h2 id=to></h2></div></div></div></main><footer class=site-footer><div class=shell>Compará compra y venta de la casa de cambio.</div></footer><script>function go(){from.textContent=a.value;to.textContent="Gs. "+Math.round(+a.value*+r.value).toLocaleString("es-PY")}b.onclick=go;[a,r].forEach(x=>x.oninput=go);go()</script></body></html>
