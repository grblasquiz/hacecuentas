<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#c45f35}.hero{background:#fff0e8}.kicker{color:var(--a)}.pump{display:grid;grid-template-columns:180px 1fr;gap:20px}.gauge{height:230px;border-radius:100px 100px 20px 20px;background:conic-gradient(from 270deg,#55a98c,#efc35d,#d05c47);padding:55px 20px;text-align:center}.primary{background:var(--a)}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Auto</nav></div></header><section class=hero><div class=shell><div class=kicker>Del surtidor a la habilitación</div><h1>¿Cuánto cuesta tener el auto?</h1><p>Combustible, patente, seguro y taller en guaraníes por cada 100 km.</p></div></section><main class=work><div class="shell pump"><div class=gauge><b id=per></b><small>por 100 km</small></div><div class=card><label>Km por mes<input id=k type=number value=1000></label><label>Consumo L/100 km<input id=c type=number value=9></label><label>Precio litro<input id=p type=number value=7200></label><button id=b class=primary>Calcular surtidor</button><h2 id=y></h2></div></div></main><footer class=site-footer><div class=shell>Costos municipales variables.</div></footer><script>const g=n=>"Gs. "+Math.round(n).toLocaleString("es-PY");function go(){let f=+c.value*+p.value,t=f*+k.value/100*12+4500000;per.textContent=g(f);y.textContent=`Costo anual ${g(t)}`}b.onclick=go;[k,c,p].forEach(x=>x.oninput=go);go()</script></body></html>
