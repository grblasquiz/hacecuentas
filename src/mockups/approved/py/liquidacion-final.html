<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=latam-58-core.css><style>:root{--a:#a24e43}.hero{background:#fff0ed}.kicker{color:var(--a)}.line{height:8px;background:#e5c5bf}.years{display:flex;justify-content:space-between}.primary{background:var(--a)}.total{font-size:2.5rem;font-weight:950}</style></head><body><header class=site-header><div class="shell nav"><b>▣ Hacé Cuentas</b><nav>Paraguay · Liquidación</nav></div></header><section class=hero><div class=shell><div class=kicker>Tu antigüedad vale</div><h1>¿Cuánto te pagan al salir?</h1><p>La línea suma preaviso, indemnización, aguinaldo y vacaciones.</p></div></section><main class=work><div class="shell grid2"><div class=card><label>Sueldo<input id=s type=number value=4500000></label><label>Años<input id=y type=number value=5></label><label>Salida<select id=r><option value=1>Despido sin causa</option><option value=0>Renuncia</option></select></label><button id=b class=primary>Liquidar</button></div><div class=card><div class=years><span>Ingreso</span><b id=yrs></b><span>Salida</span></div><div class=line></div><div id=t class=total></div><p id=d></p></div></div></main><footer class=site-footer><div class=shell>Estimación sujeta a fechas y conceptos reales.</div></footer><script>const g=n=>"Gs. "+Math.round(n).toLocaleString("es-PY");function go(){let x=+s.value*(.8+ +r.value*+y.value);yrs.textContent=y.value+" años";t.textContent=g(x);d.textContent=`Haberes proporcionales + ${r.value?"indemnización por antigüedad":"sin indemnización por renuncia"}`}b.onclick=go;[s,y,r].forEach(x=>x.oninput=go);go()</script></body></html>
