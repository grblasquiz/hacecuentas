<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Operación Renta</title>
    <link rel="stylesheet" href="cl-mockup-core.css" />
    <style>
      .hero {
        padding: 42px 0;
        background: #edf5f7;
      }
      .taxflow {
        padding: 45px 0;
      }
      .return {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 24px;
      }
      .form {
        padding: 23px;
      }
      .pipeline {
        padding: 25px;
        background: #fffdf6;
      }
      .step {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 12px;
        align-items: center;
        border-bottom: 1px dashed #aebcb7;
        padding: 14px 0;
      }
      .num {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #347a8a;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 900;
      }
      .settle {
        margin-top: 19px;
        border: 3px double #3c8269;
        padding: 18px;
      }
      .settle strong {
        font-size: 40px;
        color: #31705b;
      }
      .flag {
        padding: 10px;
        background: #fff0df;
        margin-top: 12px;
      }
      @media (max-width: 800px) {
        .return {
          grid-template-columns: 1fr;
        }
      }
  </style><style>.hero{padding:58px 0;background:linear-gradient(135deg,#eaf5f7,#f9fcfc)}.taxflow{padding:60px 0;background:#fbfcfb}.form{padding:27px}.form:before{content:"ANTECEDENTES TRIBUTARIOS";font-size:10px;letter-spacing:.15em;font-weight:950;color:#6f8286}.pipeline{padding:30px;background:#fffefa;position:relative}.pipeline:before{content:"BORRADOR · F22";position:absolute;right:26px;top:22px;border:2px solid #3c8269;color:#3c8269;padding:7px 10px;font-weight:950;font-size:11px;transform:rotate(2deg)}.step{grid-template-columns:44px 1fr auto;padding:16px 0}.num{box-shadow:0 6px 13px #2c6e7c26}.settle{border-radius:10px;background:#f6fbf8}.flag{border-radius:10px;border-left:5px solid #d47a45}.settle strong{letter-spacing:-.045em}</style>
  </head>
  <body>
    <header class="hc-head">
      <b class="brand">Hacé Cuentas</b><span class="nav">Chile · Renta</span
      ><button class="country">🇨🇱 CL</button>
    </header>
    <section class="hero">
      <div class="wrap">
        <div class="crumb">Impuestos / Operación Renta</div>
        <h1 class="display">
          Seguí la plata desde tus ingresos hasta la devolución.
        </h1>
        <p class="lead">
          Sueldos, honorarios, cotizaciones, APV y retenciones en una
          liquidación explicada.
        </p>
      </div>
    </section>
    <main class="taxflow">
      <div class="wrap return">
        <aside class="card form">
          <label>Sueldos brutos del año</label
          ><input id="wage" type="number" value="18000000" /><label
            >Honorarios brutos</label
          ><input id="fees" type="number" value="6000000" /><label
            >Impuesto retenido / PPM</label
          ><input id="held" type="number" value="1600000" /><label
            >APV y deducciones</label
          ><input id="deduct" type="number" value="900000" /><button
            class="btn"
            id="go"
            style="width: 100%; margin-top: 17px"
          >
            Preparar declaración
          </button>
        </aside>
        <section class="card pipeline">
          <div id="steps"></div>
          <div class="settle" id="settle"></div>
          <div class="flag" id="flag"></div>
        </section>
      </div>
    </main>
    <footer class="foot">
      Simulación educativa; el resultado oficial depende de tus informantes,
      topes y propuesta del SII.
    </footer>
    <script>
      (() => {
        let $ = (s) => document.querySelector(s);
        function go() {
          let w = +$("#wage").value,
            f = +$("#fees").value,
            h = +$("#held").value,
            d = +$("#deduct").value,
            taxable = Math.max(0, w + f * 0.8 - d),
            tax = Math.max(0, (taxable - 10000000) * 0.075),
            bal = h - tax,
            rows = [
              ["Ingresos informados", w + f],
              ["Base tras cotizaciones/deducciones", taxable],
              ["Impuesto anual estimado", tax],
              ["Retenciones y PPM", h],
            ];
          $("#steps").innerHTML = rows
            .map(
              (x, i) =>
                `<div class=step><i class=num>${i + 1}</i><span>${x[0]}</span><b>$${Math.round(x[1]).toLocaleString("es-CL")}</b></div>`,
            )
            .join("");
          $("#settle").innerHTML =
            `${bal >= 0 ? "Devolución estimada" : "Monto por pagar"}<br><strong>$${Math.abs(Math.round(bal)).toLocaleString("es-CL")}</strong>`;
          $("#flag").textContent =
            f > 0
              ? "Honorarios detectados: parte de la retención puede destinarse a cotizaciones previsionales antes de la devolución."
              : "Revisá que todos tus empleadores aparezcan en la propuesta.";
        }
        $("#go").onclick = go;
        go();
      })();
    </script>
  </body>
</html>
