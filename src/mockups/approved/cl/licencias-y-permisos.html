<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Licencias y permisos</title>
    <link rel="stylesheet" href="cl-mockup-core.css" />
    <style>
      .hero {
        padding: 42px 0;
        background: #f7f0f4;
      }
      .leave {
        padding: 45px 0;
      }
      .types {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .types button {
        border: 1px solid var(--line);
        background: #fff;
        padding: 10px 13px;
        border-radius: 99px;
      }
      .types .on {
        background: #97667f;
        color: #fff;
      }
      .timeline {
        margin-top: 22px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      .form,
      .care {
        padding: 23px;
      }
      .band {
        height: 78px;
        background: #ece5e9;
        border-radius: 99px;
        overflow: hidden;
        display: flex;
      }
      .band span {
        height: 100%;
        display: grid;
        place-items: center;
        background: #97667f;
        color: #fff;
        width: var(--w);
      }
      .caregrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 18px;
      }
      .caregrid div {
        padding: 14px;
        background: #f5f2f4;
      }
      .caregrid strong {
        font-size: 24px;
      }
      .next {
        margin-top: 15px;
        padding: 14px;
        border-left: 7px solid #97667f;
        background: #f8edf3;
      }
      @media (max-width: 800px) {
        .timeline {
          grid-template-columns: 1fr;
        }
        .caregrid {
          grid-template-columns: 1fr;
        }
      }
  </style><style>.hero{padding:58px 0;background:linear-gradient(135deg,#f7edf3,#fcfafb)}.leave{padding:60px 0;background:#fbfcfb}.types{background:#f1eaee;padding:6px;border-radius:15px}.types button{border:0;border-radius:11px;font-weight:800}.types .on{box-shadow:0 7px 18px #74506426}.form,.care{padding:28px}.band{height:92px;box-shadow:inset 0 0 0 1px #d8e2df}.band span{box-shadow:10px 0 25px #6e425a25;font-weight:900}.caregrid{gap:12px}.caregrid div{border-radius:12px;border-top:4px solid #97667f;box-shadow:0 6px 18px #173b470b}.next{border-radius:0 11px 11px 0}.caregrid strong{letter-spacing:-.035em}</style>
  </head>
  <body>
    <header class="hc-head">
      <b class="brand">Hacé Cuentas</b><span class="nav">Chile · Licencias</span
      ><button class="country">🇨🇱 CL</button>
    </header>
    <section class="hero">
      <div class="wrap">
        <div class="crumb">Trabajo / Licencias y permisos</div>
        <h1 class="display">¿Cuántos días cubre y quién paga?</h1>
        <p class="lead">
          Enfermedad común, accidente laboral, prenatal, postnatal parental o
          permiso del padre.
        </p>
      </div>
    </section>
    <main class="leave">
      <div class="wrap">
        <div class="types">
          <button data-t="0" class="on">Enfermedad común</button
          ><button data-t="1">Accidente laboral</button
          ><button data-t="2">Maternal</button
          ><button data-t="3">Postnatal parental</button
          ><button data-t="4">Permiso padre</button>
        </div>
        <div class="timeline">
          <aside class="card form">
            <label>Renta imponible promedio</label
            ><input id="income" type="number" value="1100000" /><label
              >Días de licencia o permiso</label
            ><input id="days" type="number" value="14" /><button
              class="btn"
              id="go"
              style="width: 100%; margin-top: 17px"
            >
              Trazar cobertura
            </button>
          </aside>
          <section class="card care">
            <div class="band"><span id="band"></span></div>
            <div class="caregrid" id="grid"></div>
            <div class="next" id="next"></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="foot">
      La autorización y el cálculo final corresponden a COMPIN, Isapre, mutual o
      entidad pagadora.
    </footer>
    <script>
      (() => {
        let t = 0,
          $ = (s) => document.querySelector(s),
          data = [
            ["Fonasa/Isapre", 0.8, "desde día 4 si dura 4–10 días"],
            ["Mutual", 1, "desde el primer día"],
            ["Subsidio maternal", 1, "prenatal y postnatal"],
            ["Seguridad Social", 1, "12 semanas jornada completa"],
            ["Empleador", 1, "5 días pagados"],
          ];
        document.querySelectorAll(".types button").forEach(
          (b) =>
            (b.onclick = () => {
              document.querySelector(".types .on").classList.remove("on");
              b.classList.add("on");
              t = +b.dataset.t;
              go();
            }),
        );
        function go() {
          let inc = +$("#income").value,
            d = +$("#days").value,
            paid = t === 0 && d < 11 ? Math.max(0, d - 3) : d,
            amount = (inc / 30) * paid * data[t][1];
          $("#band").style.cssText = `--w:${Math.min(100, (d / 30) * 100)}%`;
          $("#band").textContent = d + " días";
          $("#grid").innerHTML =
            `<div>Pagador<strong>${data[t][0]}</strong></div><div>Días cubiertos<strong>${paid}</strong></div><div>Subsidio estimado<strong>$${Math.round(amount).toLocaleString("es-CL")}</strong></div>`;
          $("#next").textContent =
            "Regla clave: " +
            data[t][2] +
            ". Presentá antecedentes dentro del plazo correspondiente.";
        }
        $("#go").onclick = go;
        go();
      })();
    </script>
  </body>
</html>
