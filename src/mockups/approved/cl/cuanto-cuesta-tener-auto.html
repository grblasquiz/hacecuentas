<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Costo anual del auto</title>
    <link rel="stylesheet" href="cl-mockup-core.css" />
    <style>
      .hero {
        padding: 44px 0;
        background: #eef4ef;
      }
      .garage {
        padding: 45px 0;
      }
      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      .form {
        padding: 23px;
      }
      .road {
        padding: 28px;
        background: #273f45;
        color: #fff;
      }
      .lane {
        height: 92px;
        border-bottom: 4px dashed #e8d58f;
        display: flex;
        align-items: end;
        gap: 8px;
      }
      .toll {
        height: var(--h);
        flex: 1;
        background: var(--c);
        border-radius: 8px 8px 0 0;
        padding: 8px;
        font-size: 11px;
      }
      .plate {
        margin-top: 22px;
        display: flex;
        justify-content: space-between;
        align-items: end;
      }
      .plate strong {
        font-size: 42px;
      }
      .checkpoints {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 18px;
      }
      .checkpoints div {
        background: #fff;
        color: var(--ink);
        padding: 12px;
        border-radius: 9px;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .checkpoints {
          grid-template-columns: 1fr 1fr;
        }
      }
  </style>
  <style>
    .hero{position:relative;overflow:hidden;padding:58px 0}.hero:after{content:"";position:absolute;right:8%;bottom:-80px;width:310px;height:190px;border:18px solid #d9e7df;border-radius:55% 55% 16% 16%;transform:skewX(-8deg)}.garage{background:#fafcfb;padding:60px 0}.form:before{content:"DATOS DE TU VEHÍCULO";font-size:10px;font-weight:950;letter-spacing:.14em;color:#768984}.road{border-radius:22px;box-shadow:0 30px 60px #1d3e4629;position:relative;overflow:hidden}.road:before{content:"COSTO DE POSESIÓN";display:block;color:#b9cbc6;font-size:10px;letter-spacing:.14em;font-weight:950;margin-bottom:20px}.lane{height:130px}.toll{transition:.25s;box-shadow:inset 0 1px #ffffff45}.plate{border-top:1px solid #ffffff24;padding-top:22px}.checkpoints div{box-shadow:0 6px 18px #102c3315}.checkpoints b{color:#2c7462}.hero .lead{max-width:610px}
  </style>
  </head>
  <body>
    <header class="hc-head">
      <b class="brand">Hacé Cuentas</b><span class="nav">Chile · Auto</span
      ><button class="country">🇨🇱 CL</button>
    </header>
    <section class="hero">
      <div class="wrap">
        <div class="crumb">Auto / Costo de tenerlo</div>
        <h1 class="display">Tu auto cobra incluso cuando está estacionado.</h1>
        <p class="lead">
          Permiso, SOAP, revisión, seguro, mantención y pérdida de valor en una
          sola vuelta anual.
        </p>
      </div>
    </section>
    <main class="garage">
      <div class="wrap layout">
        <aside class="card form">
          <label>Tasación fiscal</label
          ><input id="value" type="number" value="12000000" /><label
            >Seguro voluntario</label
          ><select id="cover">
            <option value="0">Solo SOAP</option>
            <option value="420000">Terceros</option>
            <option value="780000">Todo riesgo</option></select
          ><label>Kilómetros al mes</label
          ><input id="km" type="number" value="900" /><button
            class="btn"
            id="go"
            style="width: 100%; margin-top: 18px"
          >
            Dar una vuelta al año
          </button>
        </aside>
        <section class="card road">
          <div class="lane" id="lane"></div>
          <div class="plate">
            <span>Costo anual estimado<br /><small id="monthly"></small></span
            ><strong id="total"></strong>
          </div>
          <div class="checkpoints" id="checks"></div>
        </section>
      </div>
    </main>
    <footer class="foot">
      Estimación personalizable; permiso de circulación y seguros varían por
      vehículo y comuna.
    </footer>
    <script>
      (() => {
        let $ = (s) => document.querySelector(s);
        function go() {
          let v = +$("#value").value,
            km = +$("#km").value,
            items = [
              ["Permiso", v * 0.028, "#d27848"],
              ["Seguros", +$("#cover").value + 55000, "#3f8770"],
              ["Revisión", 42000, "#c7a044"],
              ["Mantención", km * 12 * 85, "#517c91"],
              ["Depreciación", v * 0.09, "#876c9a"],
            ],
            t = items.reduce((a, x) => a + x[1], 0),
            max = Math.max(...items.map((x) => x[1]));
          $("#lane").innerHTML = items
            .map(
              (x) =>
                `<div class=toll style="--h:${25 + (x[1] / max) * 62}px;--c:${x[2]}">${x[0]}</div>`,
            )
            .join("");
          $("#total").textContent =
            "$" + t.toLocaleString("es-CL", { maximumFractionDigits: 0 });
          $("#monthly").textContent =
            "$" + Math.round(t / 12).toLocaleString("es-CL") + " al mes";
          $("#checks").innerHTML = items
            .slice(0, 4)
            .map(
              (x) =>
                `<div><b>${x[0]}</b><br>$${Math.round(x[1]).toLocaleString("es-CL")}</div>`,
            )
            .join("");
        }
        $("#go").onclick = go;
        go();
      })();
    </script>
  </body>
</html>
